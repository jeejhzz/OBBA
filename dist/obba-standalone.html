/* ---- 아티팩트 전용 보정 ---- */
:root {
  --font-sans: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, 'Malgun Gothic', sans-serif;
  --page-bg: #eef0ee;
  --page-fg: #4b5563;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page-bg: #191b19;
    --page-fg: #9aa39a;
  }
}
:root[data-theme="dark"] {
  --page-bg: #191b19;
  --page-fg: #9aa39a;
}
body {
  background: var(--page-bg);
  color: var(--page-fg);
  padding: 0;
  flex-direction: column;
  gap: 18px;
}
/* 링크를 처음 받은 사람이 무엇인지 알 수 있게. 휴대폰이 화면을 꽉 채우는 좁은 화면에서는 숨긴다. */
.artifact-caption { display: none; }
@media (min-width: 640px) {
  /* 캡션이 들어갈 자리만큼 목업 높이를 줄인다 (원본 앱은 800px 고정) */
  .mobile-container { height: min(800px, calc(100dvh - 84px)); }
  .artifact-caption {
    display: block;
    text-align: center;
    font-size: 13px;
    line-height: 1.6;
    letter-spacing: -0.01em;
    max-width: 42ch;
  }
  .artifact-caption strong { font-weight: 700; }
  .artifact-caption span { opacity: 0.7; }
}
</style>

<div class="mobile-container">

        <span data-icon="rotate-cw" data-icon-class="w-[18px] h-[18px] mx-auto"></span>
      </button>

<script>
/**
 * 구글 시트에서 상품 목록을 읽어온다.
 *
 * 왜 필요한가
 *   가격은 세일마다 바뀌고 상품은 계속 늘어난다. 그걸 코드에 박아두면 그때마다 개발이 필요하다.
 *   시트를 읽게 해두면 시트만 고쳐도 앱에 반영된다.
 *
 * 규칙
 *   - 시트 주소가 비어 있으면 아무것도 하지 않고 내장 목록(catalog.js)을 그대로 쓴다.
 *   - 시트를 못 읽거나(오프라인, 주소 오류) 내용이 이상하면 조용히 내장 목록으로 되돌아간다.
 *     상담이 끊기는 것보다 조금 낡은 가격이 낫다.
 *   - 시트는 내장 목록을 '덮어쓰기'가 아니라 '합치기'다. 고유번호가 같으면 갱신, 없으면 추가.
 *     그래야 오빠의 큐레이션(상황x고민 16조합)이 그대로 살아있다.
 *
 * 시트 만드는 법은 docs/SPREADSHEET.md 참고.
 */
window.OBBA = window.OBBA || {};

(function () {
  /** 구글 시트 → 파일 → 공유 → 웹에 게시 → CSV 로 얻은 주소를 여기에 붙여넣으면 된다. */
  OBBA.SHEET_CSV_URL = OBBA.SHEET_CSV_URL || '';

  var TIMEOUT_MS = 4000;   // 시트가 느려도 앱이 붙잡혀 있지 않게

  /* ---------------- 한국어 값 → 내부 값 ---------------- */

  var STEP = { '클렌징':'cleanser','토너':'toner','토너패드':'pad','패드':'pad','에센스':'essence',
    '세럼':'serum','앰플':'serum','마스크팩':'mask','마스크':'mask','팩':'mask','패치':'patch',
    '로션':'lotion','크림':'cream','미스트':'mist','슬리핑팩':'sleeping','수면팩':'sleeping',
    '선크림':'sun','선케어':'sun' };

  var TEXTURE = { '가벼움':'light','가벼운':'light','산뜻':'light','보통':'medium','중간':'medium',
    '쫀쫀함':'rich','쫀쫀':'rich','무거움':'rich' };

  var SKIN = { '건성':'dry','지성':'oily','복합성':'combination','민감성':'sensitive','민감':'sensitive',
    '수부지':'dehydrated','보통':'normal','중성':'normal' };
  var ALL_SKIN = ['dry','oily','combination','sensitive','dehydrated','normal'];

  var CONCERN = { '수분':'hydration','보습':'hydration','진정':'calming','트러블':'calming',
    '미백':'brightening','톤':'brightening','결':'texture','각질':'texture','모공':'texture',
    '탄력':'elasticity','피지':'sebum','자외선':'sun' };

  var SITUATION = { '데이트':'date','약속':'date','야근':'tired','피로':'tired','여행':'travel',
    '휴가':'travel','데일리':'daily','매일':'daily' };

  /* ---------------- CSV 파싱 ---------------- */

  /** 따옴표 안의 쉼표·줄바꿈까지 제대로 처리하는 최소 CSV 파서 */
  function parseCsv(text) {
    var rows = [], row = [], field = '', quoted = false;
    for (var i = 0; i < text.length; i++) {
      var c = text.charAt(i);
      if (quoted) {
        if (c === '"') {
          if (text.charAt(i + 1) === '"') { field += '"'; i++; }
          else quoted = false;
        } else field += c;
      } else if (c === '"') { quoted = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') { field += c; }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  var COLUMN = { '고유번호':'id','사용여부':'enabled','브랜드':'brand','제품명':'name','단계':'step',
    '정가':'listPrice','판매가':'price','올리브영링크':'link','링크':'link','제형':'texture',
    '피부타입':'skinTypes','고민':'concerns','상황':'situations','이런분께':'target',
    '핵심포인트':'point','태그':'tags' };

  function key(header) {
    return COLUMN[String(header).replace(/﻿/g, '').replace(/\s+/g, '')] || null;
  }

  function splitList(value) {
    return String(value || '').split(/[,/|]/)
      .map(function (v) { return v.trim(); })
      .filter(Boolean);
  }

  function mapList(value, table, fallback) {
    var out = [];
    splitList(value).forEach(function (v) {
      if (v === '모든피부' || v === '모두') { out = out.concat(ALL_SKIN); return; }
      var mapped = table[v];
      if (mapped && out.indexOf(mapped) === -1) out.push(mapped);
    });
    return out.length ? out : (fallback || []);
  }

  function toNumber(value) {
    var n = parseInt(String(value).replace(/[^0-9]/g, ''), 10);
    return isNaN(n) ? null : n;
  }

  /** 올리브영 상품 주소를 붙여넣으면 상품번호만 뽑아낸다 */
  function goodsNoFrom(link) {
    var m = String(link || '').match(/goodsNo=([A-Za-z0-9]+)/);
    return m ? m[1] : null;
  }

  function slugId(brand, name) {
    return ('sheet-' + brand + '-' + name).trim().toLowerCase().replace(/\s+/g, '-').slice(0, 80);
  }

  /* ---------------- 한 줄 → 상품 ---------------- */

  function toProduct(raw) {
    var brand = (raw.brand || '').trim();
    var name = (raw.name || '').trim();
    if (!brand || !name) return { error: '브랜드/제품명 비어 있음' };

    var price = toNumber(raw.price);
    var listPrice = toNumber(raw.listPrice);
    if (!price) return { error: '판매가 없음 (' + brand + ' ' + name + ')' };
    if (!listPrice || listPrice < price) listPrice = price;

    var step = STEP[String(raw.step || '').trim()];
    if (!step) return { error: '단계를 못 알아봄: "' + raw.step + '" (' + name + ')' };

    var concerns = mapList(raw.concerns, CONCERN);
    if (!concerns.length) return { error: '고민이 비어 있음 (' + name + ')' };

    var skinTypes = mapList(raw.skinTypes, SKIN, ALL_SKIN);
    var situations = mapList(raw.situations, SITUATION, ['daily']);
    var texture = TEXTURE[String(raw.texture || '').trim()] || 'medium';
    var goodsNo = goodsNoFrom(raw.link);

    // 설명을 안 적었으면 태깅한 내용으로 대신 채운다 (없는 말을 지어내지 않는다)
    var koSkin = splitList(raw.skinTypes).join('·');
    var koConcern = splitList(raw.concerns).join('·');

    return {
      product: {
        id: (raw.id || '').trim() || slugId(brand, name),
        brand: brand,
        name: name,
        step: step,
        listPrice: listPrice,
        price: price,
        texture: texture,
        tags: splitList(String(raw.tags || '').replace(/\s+/g, ',')),
        keyIngredients: [],
        skinTypes: skinTypes,
        concerns: concerns,
        situations: situations,
        target: (raw.target || '').trim() || (koSkin ? koSkin + ' 피부' : '두루 무난한 선택'),
        point: (raw.point || '').trim() || (koConcern ? koConcern + ' 케어' : ''),
        goodsNo: goodsNo,
        goodsNoSource: goodsNo ? '시트에 붙여넣은 상품 링크' : undefined,
        searchQuery: brand + ' ' + name,
        fromSheet: true
      }
    };
  }

  /* ---------------- 표 전체 → 상품 목록 ---------------- */

  function buildCatalog(rows) {
    if (!rows.length) return { products: null, skipped: ['시트가 비어 있음'] };

    var headers = rows[0].map(key);
    if (headers.indexOf('brand') === -1 || headers.indexOf('name') === -1) {
      return { products: null, skipped: ['첫 줄에 열 이름(브랜드/제품명…)이 없음'] };
    }

    var merged = OBBA.CATALOG.slice();
    var index = {};
    merged.forEach(function (p, i) { index[p.id] = i; });

    var skipped = [];
    var added = 0, updated = 0, hidden = 0;

    rows.slice(1).forEach(function (cells, n) {
      if (!cells.join('').trim()) return;   // 빈 줄

      var raw = {};
      headers.forEach(function (h, i) { if (h) raw[h] = cells[i]; });

      var off = /^(n|no|아니오|숨김|x)$/i.test(String(raw.enabled || '').trim());
      var id = (raw.id || '').trim();

      if (off) {
        if (id && index[id] !== undefined) {
          merged[index[id]] = null;
          hidden++;
        }
        return;
      }

      var result = toProduct(raw);
      if (result.error) { skipped.push((n + 2) + '행: ' + result.error); return; }

      var product = result.product;
      if (index[product.id] !== undefined) {
        // 내장 상품의 태깅을 유지하되 시트 값으로 덮어쓴다
        merged[index[product.id]] = Object.assign({}, merged[index[product.id]], product);
        updated++;
      } else {
        index[product.id] = merged.length;
        merged.push(product);
        added++;
      }
    });

    return {
      products: merged.filter(Boolean),
      skipped: skipped,
      stats: { added: added, updated: updated, hidden: hidden }
    };
  }

  /* ---------------- 불러오기 ---------------- */

  function fetchWithTimeout(url) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var timer = setTimeout(function () {
        if (!done) { done = true; reject(new Error('시간 초과')); }
      }, TIMEOUT_MS);

      fetch(url, { cache: 'no-cache' })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(function (text) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          resolve(text);
        })
        .catch(function (err) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          reject(err);
        });
    });
  }

  /**
   * 시트를 읽어 카탈로그를 갱신한다. 실패해도 절대 예외를 던지지 않는다.
   * @returns {Promise<{source:'sheet'|'bundled', stats?, skipped?, reason?}>}
   */
  OBBA.loadCatalog = function () {
    var url = OBBA.SHEET_CSV_URL;
    if (!url) return Promise.resolve({ source: 'bundled', reason: '시트 주소 미설정' });

    return fetchWithTimeout(url)
      .then(function (text) {
        var built = buildCatalog(parseCsv(text));
        if (!built.products || built.products.length < 2) {
          return { source: 'bundled', reason: '시트 내용이 부족함', skipped: built.skipped };
        }
        OBBA.CATALOG = built.products;
        return { source: 'sheet', stats: built.stats, skipped: built.skipped };
      })
      .catch(function (err) {
        return { source: 'bundled', reason: String(err && err.message || err) };
      });
  };

  // 검사 도구에서 쓰기 위해 노출
  OBBA.SheetSource = { parseCsv: parseCsv, buildCatalog: buildCatalog, toProduct: toProduct,
    goodsNoFrom: goodsNoFrom };
})();

</script>

<script>
/**
 * OBBA 프로필 저장소
 * 피부타입·예산·제형 취향을 localStorage 에 보관한다.
 * 서버 없이도 "오빠가 나를 기억한다"는 경험을 만드는 최소 단위.
 */
window.OBBA = window.OBBA || {};

(function () {
  var PROFILE_KEY = 'obba.profile.v1';
  var EMPTY = { skinType: null, budget: null, texturePref: null, updatedAt: null };

  function read() {
    try {
      var raw = window.localStorage.getItem(PROFILE_KEY);
      return raw ? JSON.parse(raw) : Object.assign({}, EMPTY);
    } catch (e) {
      return Object.assign({}, EMPTY);   // 사파리 프라이빗 모드 등 저장소 접근 불가
    }
  }

  function write(value) {
    try {
      window.localStorage.setItem(PROFILE_KEY, JSON.stringify(value));
    } catch (e) { /* 저장 실패해도 대화는 계속되어야 한다 */ }
  }

  /* 못 알아들은 말 기록 —
     실제로 사람들이 어떻게 말하는지가 사전을 넓히는 가장 정확한 재료다.
     기기 안에만 남고 어디로도 전송되지 않는다. */
  var MISS_KEY = 'obba.misses.v1';
  var MISS_LIMIT = 30;

  var listeners = [];

  var Store = {
    getProfile: read,

    patchProfile: function (patch) {
      var next = Object.assign(read(), patch, { updatedAt: Date.now() });
      write(next);
      listeners.forEach(function (fn) { fn(); });
      return next;
    },

    clearProfile: function () {
      write(Object.assign({}, EMPTY));
      listeners.forEach(function (fn) { fn(); });
    },

    logMiss: function (text) {
      var clean = String(text || '').trim().slice(0, 120);
      if (!clean) return;
      try {
        var list = JSON.parse(window.localStorage.getItem(MISS_KEY) || '[]');
        if (!Array.isArray(list)) list = [];
        if (list.length && list[list.length - 1].text === clean) return;   // 같은 말 연속 저장 방지
        list.push({ text: clean, at: Date.now() });
        window.localStorage.setItem(MISS_KEY, JSON.stringify(list.slice(-MISS_LIMIT)));
      } catch (e) { /* 저장 못 해도 그만 */ }
    },

    getMisses: function () {
      try {
        var list = JSON.parse(window.localStorage.getItem(MISS_KEY) || '[]');
        return Array.isArray(list) ? list : [];
      } catch (e) { return []; }
    },

    clearMisses: function () {
      try { window.localStorage.removeItem(MISS_KEY); } catch (e) { /* 무시 */ }
    },

    subscribe: function (fn) {
      listeners.push(fn);
      return function () {
        listeners = listeners.filter(function (l) { return l !== fn; });
      };
    }
  };

  // 예전 버전에서 쓰던 장바구니 데이터가 남아 있으면 정리한다
  try { window.localStorage.removeItem('obba.cart.v1'); } catch (e) { /* 무시 */ }

  OBBA.Store = Store;
})();

</script>

<script>
/**
 * OBBA 추천 엔진
 * 큐레이션(사람이 쓴 조합) + 스코어링(개인화)의 하이브리드.
 *  - 큐레이션: 상황×고민 16조합에 대해 오빠의 코멘트와 대표 상품을 보장
 *  - 스코어링: 프로필(피부타입/예산/제형취향)로 순서를 바꾸고 후보를 보강
 * 결과 상품에는 fit(점수 + 사람이 읽을 이유)이 붙어서 UI가 근거를 보여줄 수 있다.
 */
window.OBBA = window.OBBA || {};

(function () {
  var STEP_META = {
    cleanser: { order: 1, label: '클렌징' },
    toner:    { order: 2, label: '토너' },
    pad:      { order: 2, label: '토너패드' },
    essence:  { order: 3, label: '에센스' },
    serum:    { order: 4, label: '세럼' },
    mask:     { order: 5, label: '마스크팩' },
    patch:    { order: 5, label: '패치' },
    lotion:   { order: 6, label: '로션' },
    cream:    { order: 7, label: '크림' },
    mist:     { order: 7, label: '미스트' },
    sleeping: { order: 8, label: '슬리핑팩' },
    sun:      { order: 9, label: '선케어' }
  };

  var TEXTURE_LABEL = { light: '가벼운 제형', medium: '적당한 제형', rich: '쫀쫀한 제형' };

  function discountRate(p) {
    if (!p.listPrice || p.listPrice <= p.price) return 0;
    return Math.round((1 - p.price / p.listPrice) * 100);
  }

  function formatWon(n) {
    return Number(n).toLocaleString('ko-KR') + '원';
  }

  function budgetOf(budgetId) {
    return OBBA.BUDGETS.find(function (b) { return b.id === budgetId; }) || null;
  }

  function skinTypeOf(skinTypeId) {
    return OBBA.SKIN_TYPES.find(function (s) { return s.id === skinTypeId; }) || null;
  }

  /** 프로필이 선호하는 제형: 명시적 취향 > 피부타입 기본값 */
  function preferredTexture(profile) {
    if (profile && profile.texturePref) return profile.texturePref;
    var st = skinTypeOf(profile && profile.skinType);
    return st ? st.prefer : null;
  }

  /**
   * 상품 1개의 적합도 점수와 근거를 계산한다.
   * @returns {{score:number, reasons:string[], blocked:boolean}}
   */
  function scoreProduct(p, ctx) {
    var score = 0;
    var reasons = [];
    var blocked = false;

    if (ctx.concernId && p.concerns.indexOf(ctx.concernId) !== -1) score += 30;
    if (ctx.situationId && p.situations.indexOf(ctx.situationId) !== -1) score += 15;

    var profile = ctx.profile || {};
    var st = skinTypeOf(profile.skinType);
    if (st && st.id !== 'unknown') {
      if (p.skinTypes.indexOf(st.id) !== -1) {
        score += 25;
        reasons.push(st.label.replace(/^\S+\s/, '') + ' 피부에 잘 맞음');
      } else {
        score -= 20;
      }
    }

    var wantTexture = preferredTexture(profile);
    if (wantTexture) {
      if (p.texture === wantTexture) {
        score += 15;
        reasons.push(TEXTURE_LABEL[p.texture]);
      } else if ((wantTexture === 'light' && p.texture === 'rich') ||
                 (wantTexture === 'rich' && p.texture === 'light')) {
        score -= 10;
      }
    }

    var budget = budgetOf(profile.budget);
    if (budget && budget.max !== Infinity) {
      if (p.price <= budget.max) {
        score += 10;
        reasons.push(budget.short + ' 예산 OK');
      } else {
        score -= 25;
        blocked = true;
      }
    }

    var rate = discountRate(p);
    if (rate >= 30) { score += 8; reasons.push(rate + '% 할인 중'); }
    else if (rate > 0) { score += 3; }

    if (ctx.curatedIds && ctx.curatedIds.indexOf(p.id) !== -1) {
      score += 20;
      reasons.unshift('오빠 픽');
    }

    return { score: score, reasons: reasons, blocked: blocked };
  }

  /**
   * 메인 추천 함수
   * @param {{situationId:string, concernId:string, profile:object, limit:number}} input
   * @returns {{comment:string, products:Array, key:string, personalized:boolean, note:string}}
   */
  function recommend(input) {
    var situationId = input.situationId;
    var concernId = input.concernId;
    var profile = input.profile || {};
    var limit = input.limit || 3;

    var key = situationId + '_' + concernId;
    var curated = OBBA.CURATION[key] || OBBA.FALLBACK;
    var curatedIds = curated.products.slice();
    var ctx = { situationId: situationId, concernId: concernId, profile: profile, curatedIds: curatedIds };

    var pool = OBBA.CATALOG.filter(function (p) {
      if (curatedIds.indexOf(p.id) !== -1) return true;
      // 큐레이션 밖에서는 같은 고민을 다루는 상품만 후보로
      return p.concerns.indexOf(concernId) !== -1;
    });

    var scored = pool.map(function (p) {
      var fit = scoreProduct(p, ctx);
      return Object.assign({}, p, {
        fit: fit,
        curated: curatedIds.indexOf(p.id) !== -1,
        discountRate: discountRate(p),
        priceLabel: formatWon(p.price),
        listPriceLabel: formatWon(p.listPrice)
      });
    });

    // 예산 초과 상품은 큐레이션이라도 뒤로 밀되, 대안이 없으면 살려둔다
    var affordable = scored.filter(function (p) { return !p.fit.blocked; });
    var usable = affordable.length >= 2 ? affordable : scored;

    usable.sort(function (a, b) {
      if (b.fit.score !== a.fit.score) return b.fit.score - a.fit.score;
      return curatedIds.indexOf(a.id) - curatedIds.indexOf(b.id);
    });

    var products = usable.slice(0, limit);

    // 비교 UI가 항상 동작하도록 최소 2개는 채운다
    if (products.length < 2) {
      var extra = scored.filter(function (p) {
        return products.indexOf(p) === -1;
      }).sort(function (a, b) { return b.fit.score - a.fit.score; })[0];
      if (extra) products.push(extra);
    }

    var personalized = Boolean(profile.skinType || profile.budget || profile.texturePref);
    var note = '';
    if (personalized) {
      var bits = [];
      var st = skinTypeOf(profile.skinType);
      if (st && st.id !== 'unknown') bits.push(st.label.replace(/^\S+\s/, ''));
      var bg = budgetOf(profile.budget);
      if (bg && bg.max !== Infinity) bits.push(bg.short);
      if (profile.texturePref) {
        bits.push({ light: '가벼운 제형', medium: '중간 제형', rich: '쫀쫀한 제형' }[profile.texturePref]);
      }
      if (bits.length) note = bits.join(' · ') + ' 기준으로 순서 조정함';
      // 예산 안에 드는 후보가 없으면 솔직하게 알린다
      if (bg && bg.max !== Infinity && affordable.length === 0) {
        note = bg.short + '로는 이 조합에 마땅한 게 없어서, 가장 가까운 순으로 보여줄게';
      }
    }

    return {
      comment: curated.comment,
      products: products,
      key: key,
      personalized: personalized,
      note: note
    };
  }

  /**
   * 비교 결론 생성: 프로필이 있으면 단정적으로, 없으면 선택 기준을 제시
   */
  function verdict(products, profile) {
    if (!products || products.length < 2) return '';
    var top = products[0];
    var second = products[1];
    var st = skinTypeOf(profile && profile.skinType);

    if (st && st.id !== 'unknown') {
      return '🙋‍♂️ <b>오빠의 맞춤 결론:</b><br>' +
        st.label.replace(/^\S+\s/, '') + ' 피부는 ' + st.hint + '.<br>' +
        '그래서 지금은 <b>' + top.brand + ' ' + stepMeta(top.step).label + '</b> 쪽이 더 잘 맞아. ' +
        second.brand + ' ' + stepMeta(second.step).label + '은 ' + second.target.split(',')[0] + ' 쪽에 더 어울려!';
    }
    return '🙋‍♂️ <b>오빠의 결론:</b><br>' +
      '평소 피부가 <b>[' + top.target.split(',')[0] + ']</b> 쪽이면 ' + top.brand + ', ' +
      '<b>[' + second.target.split(',')[0] + ']</b> 쪽이면 ' + second.brand + '를 담는 걸 추천할게. ' +
      '피부타입만 알려주면 둘 중 하나로 딱 찍어줄 수 있어!';
  }

  /** 올리브영 딥링크: 상품번호가 있으면 상세페이지, 없으면 검색 결과 */
  function oliveyoungUrl(p) {
    if (p.goodsNo) {
      return 'https://www.oliveyoung.co.kr/store/goods/getGoodsDetail.do?goodsNo=' + encodeURIComponent(p.goodsNo);
    }
    return 'https://www.oliveyoung.co.kr/store/search/getSearchMain.do?query=' +
      encodeURIComponent(p.searchQuery || (p.brand + ' ' + p.name));
  }

  /* ---------------- 자연어 인식 ---------------- */

  // 공백을 지우고 소문자로. 한국어는 띄어쓰기가 제각각이라 이게 인식률을 크게 올린다.
  function normalize(text) {
    return String(text == null ? '' : text).toLowerCase().replace(/\s+/g, '');
  }

  /* 한글 자모 분해 — 오타를 견디기 위해.
     "트러블"과 "트러불"은 글자로 보면 완전히 다르지만,
     자모로 풀면 ㅌㅡㄹㅓㅂㅡㄹ / ㅌㅡㄹㅓㅂㅜㄹ 로 딱 한 개만 다르다. */
  var CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  var JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  var JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

  function toJamo(str) {
    var out = '';
    for (var i = 0; i < str.length; i++) {
      var code = str.charCodeAt(i) - 0xac00;
      if (code >= 0 && code < 11172) {
        out += CHO[Math.floor(code / 588)] + JUNG[Math.floor((code % 588) / 28)] + JONG[code % 28];
      } else {
        out += str.charAt(i);
      }
    }
    return out;
  }

  /** 두 문자열이 몇 글자나 다른지 (max 를 넘으면 조기 중단) */
  function editDistance(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    var prev = [], cur = [], i, j;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) {
      cur[0] = i;
      var rowMin = cur[0];
      for (j = 1; j <= b.length; j++) {
        cur[j] = Math.min(
          prev[j] + 1,
          cur[j - 1] + 1,
          prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1)
        );
        if (cur[j] < rowMin) rowMin = cur[j];
      }
      if (rowMin > max) return max + 1;
      prev = cur.slice();
    }
    return prev[b.length];
  }

  /**
   * 오타를 감안한 매칭. 입력에서 키워드와 길이가 비슷한 구간들을 훑어
   * 자모가 몇 개나 다른지 본다. 두 글자 이하 단어는 우연히 걸리기 쉬워서 제외한다.
   * @returns 0 = 전혀 다름, 1 = 오타 수준(거의 확실), 2 = 비슷함(되물어볼 만함)
   */
  function fuzzyDistance(norm, kw) {
    if (kw.length < 3) return 0;
    var target = toJamo(kw);
    var best = 3;
    for (var len = kw.length - 1; len <= kw.length + 1; len++) {
      if (len < 2) continue;
      for (var i = 0; i + len <= norm.length; i++) {
        var d = editDistance(toJamo(norm.substr(i, len)), target, 2);
        if (d < best) best = d;
        if (best <= 1) return best === 0 ? 1 : 1;
      }
    }
    return best <= 2 ? 2 : 0;
  }

  function wordOf(kw) { return Array.isArray(kw) ? kw[0] : kw; }
  function weightOf(kw) { return Array.isArray(kw) ? kw[1] : kw.length; }

  var MIN_SCORE = 2;       // 한 글자짜리 우연한 일치로는 결론내지 않는다
  var FUZZY_NEAR = 0.7;    // 오타 한 글자 수준 — 확실한 일치보다 약간 약하게
  var FUZZY_FAR = 0.35;    // 그보다 더 다름 — 혼자서는 결론에 못 미치고 '되물어볼 후보'가 된다

  /**
   * 한 축(상황/고민/...)에서 점수가 가장 높은 후보를 고른다.
   * @returns {{best, near}} best = 확신하는 답, near = 확신은 못 하지만 되물어볼 만한 후보
   */
  function matchAxis(norm, dict) {
    var ranked = [];
    Object.keys(dict).forEach(function (id) {
      var score = 0;
      var hits = [];
      dict[id].forEach(function (kw) {
        var w = wordOf(kw);
        if (norm.indexOf(w) !== -1) {
          score += weightOf(kw);
          hits.push(w);
          return;
        }
        var d = fuzzyDistance(norm, w);
        if (d === 1) {
          score += weightOf(kw) * FUZZY_NEAR;
          hits.push(w + '(오타?)');
        } else if (d === 2) {
          score += weightOf(kw) * FUZZY_FAR;
          hits.push(w + '(비슷?)');
        }
      });
      if (score > 0) ranked.push({ id: id, score: score, hits: hits });
    });

    ranked.sort(function (a, b) { return b.score - a.score; });
    var top = ranked[0];
    if (!top) return { best: null, near: null };
    return top.score >= MIN_SCORE ? { best: top, near: null } : { best: null, near: top };
  }

  /**
   * 자연어 한 줄에서 상황/고민/피부타입/예산을 뽑아낸다.
   * @returns {{situationId, concernId, skinTypeId, budgetId, hits, understood, suggestions}}
   *   hits        축별로 실제 걸린 단어들 (왜 그렇게 알아들었는지 설명할 때)
   *   understood  하나라도 확신을 갖고 알아들었는지
   *   suggestions 확신은 못 하지만 되물어볼 만한 후보 [{axis, id}]
   */
  function parse(text) {
    var norm = normalize(text);
    var out = {
      situationId: null, concernId: null, skinTypeId: null, budgetId: null,
      hits: {}, understood: false, suggestions: []
    };
    if (!norm) return out;

    ['situation', 'concern', 'skinType', 'budget'].forEach(function (axis) {
      var m = matchAxis(norm, OBBA.KEYWORDS[axis]);
      if (m.best) {
        out[axis + 'Id'] = m.best.id;
        out.hits[axis] = m.best.hits;
      } else if (m.near) {
        out.suggestions.push({ axis: axis, id: m.near.id, score: m.near.score });
      }
    });

    out.understood = Boolean(out.situationId || out.concernId || out.skinTypeId || out.budgetId);
    // 확신한 게 있으면 애매한 후보는 굳이 되묻지 않는다
    if (out.understood) out.suggestions = [];
    out.suggestions.sort(function (a, b) { return b.score - a.score; });
    return out;
  }

  function stepMeta(step) {
    return STEP_META[step] || { order: 99, label: '기타' };
  }

  OBBA.Engine = {
    recommend: recommend,
    scoreProduct: scoreProduct,
    verdict: verdict,
    oliveyoungUrl: oliveyoungUrl,
    parse: parse,
    discountRate: discountRate,
    formatWon: formatWon,
    stepMeta: stepMeta,
    skinTypeOf: skinTypeOf,
    budgetOf: budgetOf,
    preferredTexture: preferredTexture
  };
})();

</script>

window.OBBA = window.OBBA || {};

(function () {
  var PATHS = {
    'leaf': '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" /> <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />',

    'send': '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" /> <path d="m21.854 2.147-10.94 10.939" />',
    'x': '<path d="M18 6 6 18" /> <path d="m6 6 12 12" />',
    'external-link': '<path d="M15 3h6v6" /> <path d="M10 14 21 3" /> <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />',
    'sparkles': '<path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" /> <path d="M20 2v4" /> <path d="M22 4h-4" /> <circle cx="4" cy="20" r="2" />',
    'smile': '<path d="M15 10V9" /> <path d="M16.472 15a6 6 0 01-8.943 0" /> <path d="M9 10V9" /> <circle cx="12" cy="12" r="10" />',
    'share': '<path d="M12 2v13" /> <path d="m16 6-4-4-4 4" /> <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />',
    'plus': '<path d="M5 12h14" /> <path d="M12 5v14" />'
  };

  /**
   * @param {string} name  PATHS의 키
   * @param {string} [cls] svg에 붙일 클래스
   * @param {number} [stroke] 선 두께 (기본 2)
   */
  function icon(name, cls, stroke) {
    var d = PATHS[name];
    if (!d) return '';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (stroke || 2) +
      '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="' +
      (cls || 'w-4 h-4') + '">' + d + '</svg>';
  }

  /** 정적 HTML의 <span data-icon="leaf"> 를 인라인 SVG로 치환 */
  function hydrate(root) {
    (root || document).querySelectorAll('[data-icon]').forEach(function (el) {
      var name = el.getAttribute('data-icon');
      if (!PATHS[name]) return;
      el.innerHTML = icon(name, el.getAttribute('data-icon-class') || 'w-4 h-4');
      el.removeAttribute('data-icon');
    });
  }

  OBBA.icon = icon;
  OBBA.hydrateIcons = hydrate;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { hydrate(); });
  } else {
    hydrate();
  }
})();

</script>

<script>
/**
 * OBBA 렌더링 레이어 — 문자열 HTML 빌더 모음.
 * 규칙 1: 사용자가 입력한 값은 반드시 esc()를 거친다. (프로토타입의 innerHTML 주입 취약점 수정)
 * 규칙 2: 인라인 onclick을 쓰지 않는다. data-action 속성 + 위임 리스너로 처리한다.
 */
window.OBBA = window.OBBA || {};

(function () {
  var E = OBBA.Engine;

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  var AVATAR = '<div class="w-8 h-8 rounded-full bg-olive flex items-center justify-center text-white text-xs font-bold shrink-0 shadow-sm" aria-hidden="true">OB</div>';

  /** 오빠 말풍선. html은 시나리오 작성자가 쓴 신뢰 가능한 마크업이다. */
  function botBubble(html) {
    return '<div class="flex items-start gap-2 max-w-[92%] message-enter">' + AVATAR +
      '<div class="bg-white px-4 py-3 rounded-2xl rounded-tl-sm shadow-sm border border-gray-100 text-gray-800 text-sm leading-relaxed">' +
      html + '</div></div>';
  }

  /** 사용자 말풍선. 입력값은 항상 이스케이프. */
  function userBubble(text) {
    return '<div class="flex items-start justify-end gap-2 max-w-[90%] ml-auto message-enter mb-1 mt-1">' +
      '<div class="bg-olive px-4 py-2.5 rounded-2xl rounded-tr-sm shadow-sm text-white text-sm font-medium">' +
      esc(text) + '</div></div>';
  }

  function typingBubble(id) {
    return '<div id="' + esc(id) + '" class="flex items-start gap-2 max-w-[85%] message-enter">' + AVATAR +
      '<div class="bg-white px-4 py-3 rounded-2xl rounded-tl-sm shadow-sm border border-gray-100 flex items-center gap-1 h-10">' +
      '<div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>' +
      '<div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>' +
      '<div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div></div></div>';
  }

  function quickReplyButton(item) {
    return '<button type="button" data-action="qr" data-id="' + esc(item.id) + '" ' +
      'class="horizontal-scroll-item whitespace-nowrap px-4 py-2 bg-white border border-gray-200 rounded-full text-sm text-gray-700 ' +
      'hover:bg-gray-50 hover:border-olive hover:text-olive transition-colors shadow-sm font-medium">' +
      esc(item.label) + '</button>';
  }

  function fitChips(product) {
    var reasons = (product.fit && product.fit.reasons) || [];
    if (!reasons.length) return '';
    return '<div class="flex flex-wrap gap-1 mb-2">' + reasons.slice(0, 3).map(function (r) {
      return '<span class="fit-chip">' + esc(r) + '</span>';
    }).join('') + '</div>';
  }

  function productCard(p) {
    var step = E.stepMeta(p.step);
    return '' +
      '<article class="horizontal-scroll-item product-card bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden flex flex-col">' +
        '<div class="h-28 bg-gradient-to-br from-gray-100 to-gray-200 flex items-center justify-center border-b border-gray-100 relative">' +
          '<span class="absolute top-2 left-2 text-[10px] text-gray-400 font-bold tracking-wider">' + esc(step.label) + '</span>' +
          (p.curated ? '<span class="absolute top-2 right-2 text-[10px] font-bold text-white bg-olive px-1.5 py-0.5 rounded">오빠 픽</span>' : '') +
          '<h3 class="text-lg font-black text-slate-700 tracking-tight px-3 text-center">' + esc(p.brand.toUpperCase()) + '</h3>' +
        '</div>' +
        '<div class="p-3.5 flex flex-col flex-1">' +
          '<p class="text-[11px] text-gray-500 font-bold mb-1">' + esc(p.brand) + '</p>' +
          '<h4 class="text-[13px] font-bold text-gray-800 leading-snug line-clamp-2 h-9 mb-2">' + esc(p.name) + '</h4>' +
          fitChips(p) +
          '<p class="text-[11px] text-gray-600 leading-snug mb-2">' + esc(p.point) + '</p>' +
          '<div class="flex flex-wrap gap-1 mb-3">' +
            p.tags.map(function (t) {
              return '<span class="px-1.5 py-0.5 bg-gray-100 text-gray-600 rounded text-[10px] font-medium">' + esc(t) + '</span>';
            }).join('') +
          '</div>' +
          '<div class="mt-auto pt-2 border-t border-gray-100">' +
            '<div class="flex items-baseline gap-1.5 mb-2.5">' +
              (p.discountRate ? '<span class="text-red-500 font-bold text-sm">' + p.discountRate + '%</span>' : '') +
              '<span class="text-gray-900 font-bold text-base">' + esc(p.priceLabel) + '</span>' +
              (p.discountRate ? '<span class="text-gray-400 text-[10px] line-through ml-0.5">' + esc(p.listPriceLabel) + '</span>' : '') +
            '</div>' +
            '<a href="' + esc(E.oliveyoungUrl(p)) + '" target="_blank" rel="noopener noreferrer" ' +
              'class="block text-center w-full py-2.5 bg-olive text-white text-[13px] font-bold rounded-lg hover:bg-[#8AA82A] transition-colors shadow-sm">' +
              OBBA.icon('external-link', 'w-3.5 h-3.5 inline-block align-[-2px] mr-1') + '올리브영에서 보기</a>' +
          '</div>' +
        '</div>' +
      '</article>';
  }

  function productCarousel(rec, carouselId) {
    var note = rec.note
      ? '<p class="pl-10 pr-4 mt-2 text-[11px] text-gray-500">' +
          OBBA.icon('sparkles', 'w-3.5 h-3.5 inline-block align-[-2px] mr-1 text-olive') +
          esc(rec.note) + '</p>'
      : '';
    return note +
      '<div class="w-full mt-2 pl-10 pr-4 message-enter overflow-hidden">' +
        '<div id="' + esc(carouselId) + '" class="horizontal-scroll-container hide-scrollbar" role="list">' +
          rec.products.map(productCard).join('') +
        '</div>' +
      '</div>';
  }

  function comparisonCard(products, profile) {
    var list = products.slice(0, 4);
    var cells = list.map(function (p) {
      return '<div class="bg-gray-50 p-2 rounded-lg text-center flex flex-col border border-gray-100">' +
        '<div class="text-[10px] text-gray-500 font-bold">' + esc(p.brand) + '</div>' +
        '<div class="text-[11px] font-bold text-gray-800 line-clamp-2 h-8 mb-1">' + esc(p.name) + '</div>' +
        '<div class="text-[11px] font-bold text-gray-900 mb-2">' + esc(p.priceLabel) + '</div>' +
        '<div class="bg-white border border-gray-200 rounded p-1.5 mb-1 flex-1">' +
          '<span class="text-[10px] font-bold text-olive block mb-0.5">이런 분께 딱!</span>' +
          '<span class="text-[11px] text-gray-700 leading-tight">' + esc(p.target) + '</span></div>' +
        '<div class="bg-white border border-gray-200 rounded p-1.5 mb-1 flex-1">' +
          '<span class="text-[10px] font-bold text-blue-500 block mb-0.5">핵심 성분</span>' +
          '<span class="text-[11px] text-gray-700 leading-tight">' + esc((p.keyIngredients || []).join(', ')) + '</span></div>' +
        '<div class="bg-white border border-gray-200 rounded p-1.5 flex-1">' +
          '<span class="text-[10px] font-bold text-purple-500 block mb-0.5">제형</span>' +
          '<span class="text-[11px] text-gray-700 leading-tight">' + esc({ light: '가벼움', medium: '중간', rich: '쫀쫀함' }[p.texture] || '-') + '</span></div>' +
      '</div>';
    }).join('');

    return '<div class="flex items-start gap-2 max-w-[95%] message-enter mt-2">' + AVATAR +
      '<div class="bg-white p-4 rounded-2xl rounded-tl-sm shadow-sm border border-gray-200 w-full">' +
        '<p class="text-sm text-gray-800 font-bold mb-3 border-b pb-2">💡 오빠의 베스트셀러 팩트체크</p>' +
        '<div class="grid grid-cols-2 gap-2">' + cells + '</div>' +
        '<div class="mt-3 bg-olive-soft p-3 rounded-lg text-[13px] text-gray-800 leading-snug">' +
          E.verdict(products, profile) +
        '</div>' +
      '</div></div>';
  }

  OBBA.Render = {
    esc: esc,
    botBubble: botBubble,
    userBubble: userBubble,
    typingBubble: typingBubble,
    quickReplyButton: quickReplyButton,
    productCarousel: productCarousel,
    comparisonCard: comparisonCard
  };
})();

</script>

<script>
/**
 * OBBA 대화 컨트롤러
 * 흐름: (피부타입) → 상황 → 고민 → 추천 → 비교/취향 반영 → 재추천
 * 모든 클릭은 data-action 위임 리스너 한 곳에서 처리한다.
 */
(function () {
  var R = OBBA.Render;
  var E = OBBA.Engine;
  var Store = OBBA.Store;

  var chat = document.getElementById('chat-container');
  var quickReplies = document.getElementById('quick-reply-container');
  var input = document.getElementById('user-input');
  var sendBtn = document.getElementById('send-btn');
  var profileChip = document.getElementById('profile-chip');

  var state = { step: 'situation', situationId: null, concernId: null, lastRec: null, pendingMiss: null };
  var quickReplyItems = [];
  var quickReplyHandler = null;

  /* ---------------- 기본 유틸 ---------------- */

  function scrollToBottom() {
    chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
  }

  function append(html) {
    chat.insertAdjacentHTML('beforeend', html);
    scrollToBottom();
  }

  function typing(ms) {
    var id = 'typing-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    append(R.typingBubble(id));
    return new Promise(function (resolve) {
      setTimeout(function () {
        var el = document.getElementById(id);
        if (el) el.remove();
        resolve();
      }, ms || 600);
    });
  }

  function botSay(html, ms) {
    clearQuickReplies();
    return typing(ms).then(function () { append(R.botBubble(html)); });
  }

  function userSay(text) { append(R.userBubble(text)); }

  function clearQuickReplies() {
    quickReplies.innerHTML = '';
    quickReplyItems = [];
    quickReplyHandler = null;
  }

  function setQuickReplies(items, handler) {
    quickReplyItems = items;
    quickReplyHandler = handler;
    quickReplies.innerHTML = items.map(R.quickReplyButton).join('');
    quickReplies.scrollLeft = 0;
  }

  function profileLabel() {
    var st = E.skinTypeOf(Store.getProfile().skinType);
    return st && st.id !== 'unknown' ? st.label : null;
  }

  function syncChrome() {
    var label = profileLabel();
    profileChip.textContent = label ? label + ' 프로필' : '피부타입 설정';
  }

  /* ---------------- 대화 흐름 ---------------- */

  function start() {
    chat.innerHTML = '';
    state = { step: 'situation', situationId: null, concernId: null, lastRec: null, pendingMiss: null };
    var label = profileLabel();

    var greeting = '안녕! 올리브영 뷰티 어시스턴트 <b>OBBA(오빠)</b>야 😎<br>' +
      '수만 개 제품 중에 너한테 딱 맞는 것만 골라줄게.';

    botSay(greeting, 500).then(function () {
      if (!Store.getProfile().skinType) return askSkinType();
      return botSay('지난번에 알려준 <b>' + R.esc(label) + '</b> 프로필로 골라줄게. (바꾸려면 위의 프로필 버튼을 눌러)<br>' +
        '먼저 <b>어떤 상황</b>을 준비하고 있어?', 500).then(function () {
        state.step = 'situation';
        setQuickReplies(OBBA.SITUATIONS, onSituation);
      });
    });
  }

  function askSkinType() {
    state.step = 'skinType';
    return botSay('제대로 골라주려면 <b>네 피부타입</b>부터 알아야 해. 어느 쪽에 가까워?', 500)
      .then(function () { setQuickReplies(OBBA.SKIN_TYPES, onSkinType); });
  }

  function onSkinType(item, opts) {
    if (!opts || !opts.silent) userSay(item.label);
    Store.patchProfile({ skinType: item.id, texturePref: null });
    syncChrome();
    var st = E.skinTypeOf(item.id);
    var msg = st && st.id !== 'unknown'
      ? '오케이, ' + R.esc(st.label.replace(/^\S+\s/, '')) + ' 기억했어. ' + R.esc(st.hint) + '.<br>이제 <b>어떤 상황</b>을 준비하고 있는지 알려줘!'
      : '괜찮아, 쓰면서 같이 찾아보자.<br>먼저 <b>어떤 상황</b>을 준비하고 있어?';
    return botSay(msg, 700).then(function () {
      state.step = 'situation';
      setQuickReplies(OBBA.SITUATIONS, onSituation);
    });
  }

  function onSituation(item, opts) {
    if (!opts || !opts.silent) userSay(item.label);
    state.situationId = item.id;

    // 고민을 이미 말했다면(자연어로 먼저 얘기한 경우) 또 묻지 않고 바로 추천한다
    if (state.concernId) {
      return runRecommendation(R.esc(item.reply) + ' 그럼 바로 골라볼게!');
    }

    state.step = 'concern';
    return botSay(R.esc(item.reply) + '<br>그럼 그 상황에서 <b>제일 신경 쓰이는 피부 고민</b> 딱 하나만 골라봐.', 700)
      .then(function () { setQuickReplies(OBBA.CONCERNS, onConcern); });
  }

  function onConcern(item, opts) {
    if (!opts || !opts.silent) userSay(item.label);
    state.concernId = item.id;

    if (!state.situationId) {
      state.step = 'situation';
      return botSay('오케이. 그럼 <b>언제 쓸 건지</b>만 알려주면 바로 골라줄게!', 600)
        .then(function () { setQuickReplies(OBBA.SITUATIONS, onSituation); });
    }

    return runRecommendation();
  }

  function runRecommendation(prefixMessage) {
    state.step = 'result';
    var intro = prefixMessage || '잠깐만! 오빠가 올리브영 싹 다 뒤져보는 중... 🔍👀';
    return botSay(intro, 500)
      .then(function () { return typing(900); })
      .then(function () {
        var rec = E.recommend({
          situationId: state.situationId,
          concernId: state.concernId,
          profile: Store.getProfile()
        });
        state.lastRec = rec;

        append(R.botBubble(rec.comment));
        var carouselId = 'cards-' + Date.now();
        append(R.productCarousel(rec, carouselId));
        enableDragScroll(carouselId);

        var actions = [];
        if (rec.products.length >= 2) actions.push({ id: 'compare', label: '🤔 뭐가 더 좋을까? (비교)' });
        actions.push({ id: 'change-skin', label: '🧴 피부타입 바꾸기' });
        actions.push({ id: 'budget', label: '💰 예산으로 다시 고르기' });
        actions.push({ id: 'reset', label: '🔄 다른 고민 상담하기' });
        setQuickReplies(actions, onResultAction);
      });
  }

  function onResultAction(item) {
    if (item.id === 'compare') { userSay(item.label); return showComparison(); }
    if (item.id === 'change-skin') { userSay(item.label); return askSkinType(); }
    if (item.id === 'budget') {
      userSay(item.label);
      return botSay('예산은 어느 정도로 볼까?', 400).then(function () {
        setQuickReplies(OBBA.BUDGETS, onBudget);
      });
    }
    userSay(item.label);
    return start();
  }

  function onBudget(item) {
    userSay(item.label);
    Store.patchProfile({ budget: item.id });
    syncChrome();
    return runRecommendation('오케이, ' + R.esc(item.short) + ' 기준으로 다시 골라볼게!');
  }

  function showComparison() {
    var rec = state.lastRec;
    if (!rec || rec.products.length < 2) {
      return botSay('지금은 하나만 추천해서 비교할 게 없네! 다른 고민도 말해줄래?', 400)
        .then(function () { setQuickReplies([{ id: 'reset', label: '🔄 처음부터 다시하기' }], function () { start(); }); });
    }
    return typing(800).then(function () {
      append(R.comparisonCard(rec.products, Store.getProfile()));
      return botSay('참고로 너는 평소에 어떤 제형이 좋아? 알려주면 다음 추천부터 바로 반영할게.', 900);
    }).then(function () {
      setQuickReplies([
        { id: 'light', label: '💦 가벼운 수분타입' },
        { id: 'rich', label: '🍯 쫀쫀한 영양타입' },
        { id: 'reset', label: '🔄 다른 고민 상담하기' }
      ], onTexturePick);
    });
  }

  function onTexturePick(item) {
    userSay(item.label);
    if (item.id === 'reset') return start();
    Store.patchProfile({ texturePref: item.id });
    syncChrome();
    return runRecommendation('취향 반영 완료! ' + R.esc(item.label.replace(/^\S+\s/, '')) + ' 기준으로 순서 다시 잡아볼게.');
  }

  /* ---------------- 자연어 입력 ---------------- */

  /** 이번 입력에서 프로필로 새로 반영된 내용을 사람 말로 (없으면 빈 문자열) */
  function ackProfile(parsed) {
    var bits = [];
    if (parsed.skinTypeId) bits.push(E.skinTypeOf(parsed.skinTypeId).label.replace(/^\S+\s/, ''));
    if (parsed.budgetId) bits.push(E.budgetOf(parsed.budgetId).short);
    return bits.length ? R.esc(bits.join(' · ')) + ' 체크했어.' : '';
  }

  var AXIS_LIST = {
    situation: function () { return OBBA.SITUATIONS; },
    concern:   function () { return OBBA.CONCERNS; },
    skinType:  function () { return OBBA.SKIN_TYPES; },
    budget:    function () { return OBBA.BUDGETS; }
  };

  /** 확신은 못 했지만 짚이는 후보를 "혹시 이거야?" 버튼으로 만든다 */
  function suggestionItems(suggestions) {
    return suggestions.slice(0, 2).map(function (sug) {
      var list = AXIS_LIST[sug.axis] ? AXIS_LIST[sug.axis]() : [];
      var found = list.find(function (i) { return i.id === sug.id; });
      if (!found) return null;
      return { id: 'sug:' + sug.axis + ':' + sug.id, label: found.label, axis: sug.axis, target: found };
    }).filter(Boolean);
  }

  function onSuggestionPick(item) {
    if (item.id === 'no') {
      userSay(item.label);
      // 되물었는데 아니라고 하면 결국 못 알아들은 것 — 사전을 넓힐 재료로 남긴다
      Store.logMiss(state.pendingMiss);
      return botSay('그럼 아래에서 골라줄래?', 400).then(function () {
        if (state.situationId) { state.step = 'concern'; setQuickReplies(OBBA.CONCERNS, onConcern); }
        else { state.step = 'situation'; setQuickReplies(OBBA.SITUATIONS, onSituation); }
      });
    }
    userSay(item.label);
    if (item.axis === 'concern') return onConcern(item.target, { silent: true });
    if (item.axis === 'situation') return onSituation(item.target, { silent: true });
    if (item.axis === 'skinType') return onSkinType(item.target, { silent: true });
    if (item.axis === 'budget') return onBudget(item.target);
    return start();
  }

  /** 못 알아들은 말 모아보기 (사전을 넓힐 재료) */
  function showMisses() {
    var misses = Store.getMisses();
    if (!misses.length) {
      return botSay('아직 못 알아들은 말이 없어. 잘하고 있다는 뜻이지 😎', 400)
        .then(function () { setQuickReplies([{ id: 'reset', label: '🔄 처음부터 다시하기' }], function () { start(); }); });
    }
    var list = misses.slice(-15).reverse().map(function (m) {
      var d = new Date(m.at);
      return '· ' + R.esc(m.text) + ' <span class="text-gray-400 text-[11px]">(' +
        (d.getMonth() + 1) + '/' + d.getDate() + ')</span>';
    }).join('<br>');
    return botSay('내가 못 알아들었던 말 ' + misses.length + '개야. 이걸 개발자한테 보여주면 사전을 넓힐 수 있어.<br><br>' +
      list, 400)
      .then(function () {
        setQuickReplies([
          { id: 'clear', label: '🗑 기록 지우기' },
          { id: 'reset', label: '🔄 처음부터 다시하기' }
        ], function (item) {
          if (item.id === 'clear') {
            Store.clearMisses();
            return botSay('기록 지웠어!', 300)
              .then(function () { setQuickReplies([{ id: 'reset', label: '🔄 처음부터 다시하기' }], function () { start(); }); });
          }
          return start();
        });
      });
  }

  function labelOf(list, id) {
    var found = list.find(function (i) { return i.id === id; });
    return found ? found.label.replace(/^\S+\s/, '') : '';
  }

  function processInput() {
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    userSay(text);
    clearQuickReplies();

    if (/^(기록|로그|못알아들은|안된말)/.test(text.replace(/\s+/g, ''))) {
      showMisses();
      return;
    }

    var parsed = E.parse(text);

    // 피부타입·예산은 어느 단계에서 말하든 프로필에 반영한다
    var profilePatch = {};
    if (parsed.skinTypeId) profilePatch.skinType = parsed.skinTypeId;
    if (parsed.budgetId) profilePatch.budget = parsed.budgetId;
    var profileChanged = Object.keys(profilePatch).length > 0;
    if (profileChanged) {
      Store.patchProfile(profilePatch);
      syncChrome();
    }

    if (parsed.situationId) state.situationId = parsed.situationId;
    if (parsed.concernId) state.concernId = parsed.concernId;

    var ack = ackProfile(parsed);

    // 1) 상황과 고민이 다 모였으면 바로 추천
    if (state.situationId && state.concernId && parsed.understood) {
      runRecommendation(ack ? ack + ' 바로 골라볼게!' : '알겠어, 바로 골라볼게!');
      return;
    }

    // 2) 고민만 알아들었다 → 상황 하나만 더 물어본다
    //    (이번 입력이 아무것도 못 알아들은 경우는 아래 되묻기/기록으로 보낸다)
    if (parsed.understood && state.concernId && !state.situationId) {
      var concernName = labelOf(OBBA.CONCERNS, state.concernId);
      botSay('<b>' + R.esc(concernName) + '</b> 얘기구나, 알겠어. ' + (ack ? ack + ' ' : '') +
        '<br>언제 쓸 건지만 알려주면 바로 골라줄게!', 600)
        .then(function () {
          state.step = 'situation';
          setQuickReplies(OBBA.SITUATIONS, onSituation);
        });
      return;
    }

    // 3) 상황만 알아들었다 → 고민 하나만 더 물어본다
    if (parsed.understood && state.situationId && !state.concernId) {
      var situation = OBBA.SITUATIONS.find(function (s) { return s.id === state.situationId; });
      botSay(R.esc(situation ? situation.reply : '') + (ack ? ' ' + ack : '') +
        '<br>그럼 <b>제일 신경 쓰이는 피부 고민</b> 하나만 골라봐.', 600)
        .then(function () {
          state.step = 'concern';
          setQuickReplies(OBBA.CONCERNS, onConcern);
        });
      return;
    }

    // 4) 추천을 이미 받은 상태에서 비교를 요청
    if (state.step === 'result' && (text.indexOf('비교') !== -1 || text.indexOf('차이') !== -1)) {
      showComparison();
      return;
    }

    // 5) 피부타입·예산만 말한 경우
    if (profileChanged) {
      if (state.step === 'result' && state.situationId && state.concernId) {
        runRecommendation(ack + ' 그 기준으로 다시 골라볼게!');
        return;
      }
      var next = state.step === 'concern' ? '고민' : '상황';
      botSay(ack + ' 기억해뒀어.<br>이제 어떤 <b>' + next + '</b>인지 알려줘!', 600)
        .then(function () {
          if (state.step === 'concern') setQuickReplies(OBBA.CONCERNS, onConcern);
          else { state.step = 'situation'; setQuickReplies(OBBA.SITUATIONS, onSituation); }
        });
      return;
    }

    // 6) 확신은 못 했지만 짚이는 게 있으면 되묻는다 (막다른 길 대신 한 번의 탭으로)
    var guesses = suggestionItems(parsed.suggestions);
    if (guesses.length) {
      state.pendingMiss = text;
      botSay('음... 혹시 이 얘기야?', 500).then(function () {
        setQuickReplies(guesses.concat([{ id: 'no', label: '🙅 아니야' }]), onSuggestionPick);
      });
      return;
    }

    // 7) 하나도 못 알아들었다 — 기록해두고(사전을 넓힐 재료) 예시를 알려준다
    Store.logMiss(text);
    var askConcern = Boolean(state.situationId);
    botSay('음, 그 말은 아직 못 알아듣겠어 😅<br>' +
      '<b>"여행 갈 때 트러블"</b> 처럼 말해주면 딱 알아들어.<br>아니면 아래에서 골라줘!', 600)
      .then(function () {
        if (askConcern) {
          state.step = 'concern';
          setQuickReplies(OBBA.CONCERNS, onConcern);
        } else {
          state.step = 'situation';
          setQuickReplies(OBBA.SITUATIONS, onSituation);
        }
      });
  }

  /* ---------------- 이벤트 위임 ---------------- */

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');

    if (action === 'qr') {
      var id = el.getAttribute('data-id');
      var item = quickReplyItems.find(function (i) { return i.id === id; });
      if (item && quickReplyHandler) {
        var handler = quickReplyHandler;
        clearQuickReplies();
        handler(item);
      }
      return;
    }
    if (action === 'edit-profile') { askSkinType(); return; }
    if (action === 'restart') { start(); return; }
  });

  sendBtn.addEventListener('click', processInput);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') processInput();
  });

  /* 데스크톱에서 카드 캐러셀 드래그 스크롤 */
  function enableDragScroll(containerId) {
    var slider = document.getElementById(containerId);
    if (!slider) return;
    var isDown = false, startX = 0, scrollLeft = 0;
    slider.addEventListener('mousedown', function (e) {
      isDown = true;
      slider.classList.add('dragging');
      startX = e.pageX - slider.offsetLeft;
      scrollLeft = slider.scrollLeft;
    });
    ['mouseleave', 'mouseup'].forEach(function (evt) {
      slider.addEventListener(evt, function () {
        isDown = false;
        slider.classList.remove('dragging');
      });
    });
    slider.addEventListener('mousemove', function (e) {
      if (!isDown) return;
      e.preventDefault();
      slider.scrollLeft = scrollLeft - ((e.pageX - slider.offsetLeft) - startX) * 1.4;
    });
  }

  Store.subscribe(syncChrome);
  syncChrome();

  // 시트가 설정돼 있으면 상품 목록을 먼저 갱신하고 대화를 시작한다.
  // 시트가 없거나 못 읽어도 내장 목록으로 그대로 진행한다 (상담이 끊기면 안 된다).
  if (typeof OBBA.loadCatalog === 'function') {
    OBBA.loadCatalog().then(function (res) {
      if (res.source === 'sheet') {
        console.info('[OBBA] 시트에서 상품 목록 갱신', res.stats,
          res.skipped && res.skipped.length ? '건너뜀: ' + res.skipped.join(' / ') : '');
      } else if (res.reason && res.reason !== '시트 주소 미설정') {
        console.warn('[OBBA] 시트를 못 읽어서 내장 목록으로 진행합니다 —', res.reason);
      }
      start();
    });
  } else {
    start();
  }
})();

</script>
