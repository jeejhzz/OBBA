/* ---- 아티팩트 전용 보정 ---- */
:root {
  --font-sans: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, 'Malgun Gothic', sans-serif;
  --page-bg: #eef0ee;
  --page-fg: #4b5563;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page-bg: #191b19;
    --page-fg: #9aa39a;
  }
}
:root[data-theme="dark"] {
  --page-bg: #191b19;
  --page-fg: #9aa39a;
}
body {
  background: var(--page-bg);
  color: var(--page-fg);
  padding: 0;
  flex-direction: column;
  gap: 18px;
}
/* 링크를 처음 받은 사람이 무엇인지 알 수 있게. 휴대폰이 화면을 꽉 채우는 좁은 화면에서는 숨긴다. */

<script>
/**
 * OBBA 로컬 저장소
 * 프로필(피부타입/예산/제형취향)과 장바구니를 localStorage에 보관한다.
 * 서버 없이도 "오빠가 나를 기억한다"는 경험을 만드는 최소 단위.
 */
window.OBBA = window.OBBA || {};

(function () {
  var PROFILE_KEY = 'obba.profile.v1';
  var CART_KEY = 'obba.cart.v1';

  function read(key, fallback) {
    try {
      var raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback; // 사파리 프라이빗 모드 등 저장소 접근 불가
    }
  }

  function write(key, value) {
    try {
      window.localStorage.setItem(key, JSON.stringify(value));
    } catch (e) { /* 저장 실패해도 대화는 계속되어야 한다 */ }
  }

  var listeners = [];

  var Store = {
    /* ---------- 프로필 ---------- */
    getProfile: function () {
      return read(PROFILE_KEY, { skinType: null, budget: null, texturePref: null, updatedAt: null });
    },
    patchProfile: function (patch) {
      var next = Object.assign(Store.getProfile(), patch, { updatedAt: Date.now() });
      write(PROFILE_KEY, next);
      emit();
      return next;
    },
    clearProfile: function () {
      write(PROFILE_KEY, { skinType: null, budget: null, texturePref: null, updatedAt: null });
      emit();
    },

    /* ---------- 장바구니 ---------- */
    getCart: function () {
      var cart = read(CART_KEY, []);
      return Array.isArray(cart) ? cart : [];
    },
    addToCart: function (productId) {
      var cart = Store.getCart();
      var line = cart.find(function (l) { return l.id === productId; });
      if (line) { line.qty += 1; } else { cart.push({ id: productId, qty: 1 }); }
      write(CART_KEY, cart);
      emit();
      return cart;
    },
    setQty: function (productId, qty) {
      var cart = Store.getCart().map(function (l) {
        return l.id === productId ? { id: l.id, qty: qty } : l;
      }).filter(function (l) { return l.qty > 0; });
      write(CART_KEY, cart);
      emit();
      return cart;
    },
    removeFromCart: function (productId) {
      return Store.setQty(productId, 0);
    },
    clearCart: function () {
      write(CART_KEY, []);
      emit();
    },
    cartCount: function () {
      return Store.getCart().reduce(function (sum, l) { return sum + l.qty; }, 0);
    },
    /** 장바구니 합계: 판매가 총합 / 정가 총합 / 절약액 */
    cartTotals: function () {
      return Store.getCart().reduce(function (acc, line) {
        var p = OBBA.byId(line.id);
        if (!p) return acc;
        acc.price += p.price * line.qty;
        acc.listPrice += p.listPrice * line.qty;
        acc.saved = acc.listPrice - acc.price;
        return acc;
      }, { price: 0, listPrice: 0, saved: 0 });
    },

    /* ---------- 변경 구독 ---------- */
    subscribe: function (fn) { listeners.push(fn); return function () {
      listeners = listeners.filter(function (l) { return l !== fn; });
    }; }
  };

  function emit() { listeners.forEach(function (fn) { fn(); }); }

  OBBA.Store = Store;
})();

</script>

<script>
/**
 * OBBA 추천 엔진
 * 큐레이션(사람이 쓴 조합) + 스코어링(개인화)의 하이브리드.
 *  - 큐레이션: 상황×고민 16조합에 대해 오빠의 코멘트와 대표 상품을 보장
 *  - 스코어링: 프로필(피부타입/예산/제형취향)로 순서를 바꾸고 후보를 보강
 * 결과 상품에는 fit(점수 + 사람이 읽을 이유)이 붙어서 UI가 근거를 보여줄 수 있다.
 */
window.OBBA = window.OBBA || {};

(function () {
  var STEP_META = {
    cleanser: { order: 1, label: '클렌징' },
    toner:    { order: 2, label: '토너' },
    pad:      { order: 2, label: '토너패드' },
    essence:  { order: 3, label: '에센스' },
    serum:    { order: 4, label: '세럼' },
    mask:     { order: 5, label: '마스크팩' },
    patch:    { order: 5, label: '패치' },
    lotion:   { order: 6, label: '로션' },
    cream:    { order: 7, label: '크림' },
    mist:     { order: 7, label: '미스트' },
    sleeping: { order: 8, label: '슬리핑팩' },
    sun:      { order: 9, label: '선케어' }
  };

  var TEXTURE_LABEL = { light: '가벼운 제형', medium: '적당한 제형', rich: '쫀쫀한 제형' };

  function discountRate(p) {
    if (!p.listPrice || p.listPrice <= p.price) return 0;
    return Math.round((1 - p.price / p.listPrice) * 100);
  }

  function formatWon(n) {
    return Number(n).toLocaleString('ko-KR') + '원';
  }

  function budgetOf(budgetId) {
    return OBBA.BUDGETS.find(function (b) { return b.id === budgetId; }) || null;
  }

  function skinTypeOf(skinTypeId) {
    return OBBA.SKIN_TYPES.find(function (s) { return s.id === skinTypeId; }) || null;
  }

  /** 프로필이 선호하는 제형: 명시적 취향 > 피부타입 기본값 */
  function preferredTexture(profile) {
    if (profile && profile.texturePref) return profile.texturePref;
    var st = skinTypeOf(profile && profile.skinType);
    return st ? st.prefer : null;
  }

  /**
   * 상품 1개의 적합도 점수와 근거를 계산한다.
   * @returns {{score:number, reasons:string[], blocked:boolean}}
   */
  function scoreProduct(p, ctx) {
    var score = 0;
    var reasons = [];
    var blocked = false;

    if (ctx.concernId && p.concerns.indexOf(ctx.concernId) !== -1) score += 30;
    if (ctx.situationId && p.situations.indexOf(ctx.situationId) !== -1) score += 15;

    var profile = ctx.profile || {};
    var st = skinTypeOf(profile.skinType);
    if (st && st.id !== 'unknown') {
      if (p.skinTypes.indexOf(st.id) !== -1) {
        score += 25;
        reasons.push(st.label.replace(/^\S+\s/, '') + ' 피부에 잘 맞음');
      } else {
        score -= 20;
      }
    }

    var wantTexture = preferredTexture(profile);
    if (wantTexture) {
      if (p.texture === wantTexture) {
        score += 15;
        reasons.push(TEXTURE_LABEL[p.texture]);
      } else if ((wantTexture === 'light' && p.texture === 'rich') ||
                 (wantTexture === 'rich' && p.texture === 'light')) {
        score -= 10;
      }
    }

    var budget = budgetOf(profile.budget);
    if (budget && budget.max !== Infinity) {
      if (p.price <= budget.max) {
        score += 10;
        reasons.push(budget.short + ' 예산 OK');
      } else {
        score -= 25;
        blocked = true;
      }
    }

    var rate = discountRate(p);
    if (rate >= 30) { score += 8; reasons.push(rate + '% 할인 중'); }
    else if (rate > 0) { score += 3; }

    if (ctx.curatedIds && ctx.curatedIds.indexOf(p.id) !== -1) {
      score += 20;
      reasons.unshift('오빠 픽');
    }

    return { score: score, reasons: reasons, blocked: blocked };
  }

  /**
   * 메인 추천 함수
   * @param {{situationId:string, concernId:string, profile:object, limit:number}} input
   * @returns {{comment:string, products:Array, key:string, personalized:boolean, note:string}}
   */
  function recommend(input) {
    var situationId = input.situationId;
    var concernId = input.concernId;
    var profile = input.profile || {};
    var limit = input.limit || 3;

    var key = situationId + '_' + concernId;
    var curated = OBBA.CURATION[key] || OBBA.FALLBACK;
    var curatedIds = curated.products.slice();
    var ctx = { situationId: situationId, concernId: concernId, profile: profile, curatedIds: curatedIds };

    var pool = OBBA.CATALOG.filter(function (p) {
      if (curatedIds.indexOf(p.id) !== -1) return true;
      // 큐레이션 밖에서는 같은 고민을 다루는 상품만 후보로
      return p.concerns.indexOf(concernId) !== -1;
    });

    var scored = pool.map(function (p) {
      var fit = scoreProduct(p, ctx);
      return Object.assign({}, p, {
        fit: fit,
        curated: curatedIds.indexOf(p.id) !== -1,
        discountRate: discountRate(p),
        priceLabel: formatWon(p.price),
        listPriceLabel: formatWon(p.listPrice)
      });
    });

    // 예산 초과 상품은 큐레이션이라도 뒤로 밀되, 대안이 없으면 살려둔다
    var affordable = scored.filter(function (p) { return !p.fit.blocked; });
    var usable = affordable.length >= 2 ? affordable : scored;

    usable.sort(function (a, b) {
      if (b.fit.score !== a.fit.score) return b.fit.score - a.fit.score;
      return curatedIds.indexOf(a.id) - curatedIds.indexOf(b.id);
    });

    var products = usable.slice(0, limit);

    // 비교 UI가 항상 동작하도록 최소 2개는 채운다
    if (products.length < 2) {
      var extra = scored.filter(function (p) {
        return products.indexOf(p) === -1;
      }).sort(function (a, b) { return b.fit.score - a.fit.score; })[0];
      if (extra) products.push(extra);
    }

    var personalized = Boolean(profile.skinType || profile.budget || profile.texturePref);
    var note = '';
    if (personalized) {
      var bits = [];
      var st = skinTypeOf(profile.skinType);
      if (st && st.id !== 'unknown') bits.push(st.label.replace(/^\S+\s/, ''));
      var bg = budgetOf(profile.budget);
      if (bg && bg.max !== Infinity) bits.push(bg.short);
      if (profile.texturePref) {
        bits.push({ light: '가벼운 제형', medium: '중간 제형', rich: '쫀쫀한 제형' }[profile.texturePref]);
      }
      if (bits.length) note = bits.join(' · ') + ' 기준으로 순서 조정함';
      // 예산 안에 드는 후보가 없으면 솔직하게 알린다
      if (bg && bg.max !== Infinity && affordable.length === 0) {
        note = bg.short + '로는 이 조합에 마땅한 게 없어서, 가장 가까운 순으로 보여줄게';
      }
    }

    return {
      comment: curated.comment,
      products: products,
      key: key,
      personalized: personalized,
      note: note
    };
  }

  /**
   * 비교 결론 생성: 프로필이 있으면 단정적으로, 없으면 선택 기준을 제시
   */
  function verdict(products, profile) {
    if (!products || products.length < 2) return '';
    var top = products[0];
    var second = products[1];
    var st = skinTypeOf(profile && profile.skinType);

    if (st && st.id !== 'unknown') {
      return '🙋‍♂️ <b>오빠의 맞춤 결론:</b><br>' +
        st.label.replace(/^\S+\s/, '') + ' 피부는 ' + st.hint + '.<br>' +
        '그래서 지금은 <b>' + top.brand + ' ' + stepMeta(top.step).label + '</b> 쪽이 더 잘 맞아. ' +
        second.brand + ' ' + stepMeta(second.step).label + '은 ' + second.target.split(',')[0] + ' 쪽에 더 어울려!';
    }
    return '🙋‍♂️ <b>오빠의 결론:</b><br>' +
      '평소 피부가 <b>[' + top.target.split(',')[0] + ']</b> 쪽이면 ' + top.brand + ', ' +
      '<b>[' + second.target.split(',')[0] + ']</b> 쪽이면 ' + second.brand + '를 담는 걸 추천할게. ' +
      '피부타입만 알려주면 둘 중 하나로 딱 찍어줄 수 있어!';
  }

  /** 올리브영 딥링크: 상품번호가 있으면 상세페이지, 없으면 검색 결과 */
  function oliveyoungUrl(p) {
    if (p.goodsNo) {
      return 'https://www.oliveyoung.co.kr/store/goods/getGoodsDetail.do?goodsNo=' + encodeURIComponent(p.goodsNo);
    }
    return 'https://www.oliveyoung.co.kr/store/search/getSearchMain.do?query=' +
      encodeURIComponent(p.searchQuery || (p.brand + ' ' + p.name));
  }

  /** 자연어 한 줄에서 상황/고민/피부타입/예산을 뽑아낸다 (부분 문자열 매칭) */
  function parse(text) {
    var out = { situationId: null, concernId: null, skinTypeId: null, budgetId: null };
    if (!text) return out;
    Object.keys(OBBA.KEYWORDS).forEach(function (axis) {
      var dict = OBBA.KEYWORDS[axis];
      Object.keys(dict).forEach(function (id) {
        if (out[axis + 'Id']) return;
        var hit = dict[id].some(function (kw) { return text.indexOf(kw) !== -1; });
        if (hit) out[axis + 'Id'] = id;
      });
    });
    return out;
  }

  function stepMeta(step) {
    return STEP_META[step] || { order: 99, label: '기타' };
  }

  /** 장바구니를 루틴 순서(클렌징→선케어)로 정렬 */
  function sortByRoutine(products) {
    return products.slice().sort(function (a, b) {
      return stepMeta(a.step).order - stepMeta(b.step).order;
    });
  }

  OBBA.Engine = {
    recommend: recommend,
    scoreProduct: scoreProduct,
    verdict: verdict,
    oliveyoungUrl: oliveyoungUrl,
    parse: parse,
    discountRate: discountRate,
    formatWon: formatWon,
    stepMeta: stepMeta,
    sortByRoutine: sortByRoutine,
    skinTypeOf: skinTypeOf,
    budgetOf: budgetOf,
    preferredTexture: preferredTexture
  };
})();

</script>

window.OBBA = window.OBBA || {};

(function () {
  var PATHS = {

    'shopping-bag': '<path d="M16 10a4 4 0 0 1-8 0" /> <path d="M3.103 6.034h17.794" /> <path d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z" />',
    'rotate-cw': '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" />',
    'send': '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" /> <path d="m21.854 2.147-10.94 10.939" />',
    'x': '<path d="M18 6 6 18" /> <path d="m6 6 12 12" />',
    'external-link': '<path d="M15 3h6v6" /> <path d="M10 14 21 3" /> <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />',
    'sparkles': '<path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" /> <path d="M20 2v4" /> <path d="M22 4h-4" /> <circle cx="4" cy="20" r="2" />',
    'smile': '<path d="M15 10V9" /> <path d="M16.472 15a6 6 0 01-8.943 0" /> <path d="M9 10V9" /> <circle cx="12" cy="12" r="10" />'
  };

  /**
   * @param {string} name  PATHS의 키
   * @param {string} [cls] svg에 붙일 클래스
   * @param {number} [stroke] 선 두께 (기본 2)
   */
  function icon(name, cls, stroke) {
    var d = PATHS[name];
    if (!d) return '';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (stroke || 2) +
      '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="' +
      (cls || 'w-4 h-4') + '">' + d + '</svg>';
  }

  /** 정적 HTML의 <span data-icon="leaf"> 를 인라인 SVG로 치환 */
  function hydrate(root) {
    (root || document).querySelectorAll('[data-icon]').forEach(function (el) {
      var name = el.getAttribute('data-icon');
      if (!PATHS[name]) return;
      el.innerHTML = icon(name, el.getAttribute('data-icon-class') || 'w-4 h-4');
      el.removeAttribute('data-icon');
    });
  }

  OBBA.icon = icon;
  OBBA.hydrateIcons = hydrate;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { hydrate(); });
  } else {
    hydrate();
  }
})();

</script>

<script>
/**
 * OBBA 렌더링 레이어 — 문자열 HTML 빌더 모음.
 * 규칙 1: 사용자가 입력한 값은 반드시 esc()를 거친다. (프로토타입의 innerHTML 주입 취약점 수정)
 * 규칙 2: 인라인 onclick을 쓰지 않는다. data-action 속성 + 위임 리스너로 처리한다.
 */
window.OBBA = window.OBBA || {};

(function () {
  var E = OBBA.Engine;

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  var AVATAR = '<div class="w-8 h-8 rounded-full bg-olive flex items-center justify-center text-white text-xs font-bold shrink-0 shadow-sm" aria-hidden="true">OB</div>';

  /** 오빠 말풍선. html은 시나리오 작성자가 쓴 신뢰 가능한 마크업이다. */
  function botBubble(html) {
    return '<div class="flex items-start gap-2 max-w-[92%] message-enter">' + AVATAR +
      '<div class="bg-white px-4 py-3 rounded-2xl rounded-tl-sm shadow-sm border border-gray-100 text-gray-800 text-sm leading-relaxed">' +
      html + '</div></div>';
  }

  /** 사용자 말풍선. 입력값은 항상 이스케이프. */
  function userBubble(text) {
    return '<div class="flex items-start justify-end gap-2 max-w-[90%] ml-auto message-enter mb-1 mt-1">' +
      '<div class="bg-olive px-4 py-2.5 rounded-2xl rounded-tr-sm shadow-sm text-white text-sm font-medium">' +
      esc(text) + '</div></div>';
  }

  function typingBubble(id) {
    return '<div id="' + esc(id) + '" class="flex items-start gap-2 max-w-[85%] message-enter">' + AVATAR +
      '<div class="bg-white px-4 py-3 rounded-2xl rounded-tl-sm shadow-sm border border-gray-100 flex items-center gap-1 h-10">' +
      '<div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>' +
      '<div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>' +
      '<div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div></div></div>';
  }

  function quickReplyButton(item) {
    return '<button type="button" data-action="qr" data-id="' + esc(item.id) + '" ' +
      'class="horizontal-scroll-item whitespace-nowrap px-4 py-2 bg-white border border-gray-200 rounded-full text-sm text-gray-700 ' +
      'hover:bg-gray-50 hover:border-olive hover:text-olive transition-colors shadow-sm font-medium">' +
      esc(item.label) + '</button>';
  }

  function fitChips(product) {
    var reasons = (product.fit && product.fit.reasons) || [];
    if (!reasons.length) return '';
    return '<div class="flex flex-wrap gap-1 mb-2">' + reasons.slice(0, 3).map(function (r) {
      return '<span class="fit-chip">' + esc(r) + '</span>';
    }).join('') + '</div>';
  }

  function productCard(p) {
    var step = E.stepMeta(p.step);
    return '' +
      '<article class="horizontal-scroll-item product-card bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden flex flex-col">' +
        '<div class="h-28 bg-gradient-to-br from-gray-100 to-gray-200 flex items-center justify-center border-b border-gray-100 relative">' +
          '<span class="absolute top-2 left-2 text-[10px] text-gray-400 font-bold tracking-wider">' + esc(step.label) + '</span>' +
          (p.curated ? '<span class="absolute top-2 right-2 text-[10px] font-bold text-white bg-olive px-1.5 py-0.5 rounded">오빠 픽</span>' : '') +
          '<h3 class="text-lg font-black text-slate-700 tracking-tight px-3 text-center">' + esc(p.brand.toUpperCase()) + '</h3>' +
        '</div>' +
        '<div class="p-3.5 flex flex-col flex-1">' +
          '<p class="text-[11px] text-gray-500 font-bold mb-1">' + esc(p.brand) + '</p>' +
          '<h4 class="text-[13px] font-bold text-gray-800 leading-snug line-clamp-2 h-9 mb-2">' + esc(p.name) + '</h4>' +
          fitChips(p) +
          '<p class="text-[11px] text-gray-600 leading-snug mb-2">' + esc(p.point) + '</p>' +
          '<div class="flex flex-wrap gap-1 mb-3">' +
            p.tags.map(function (t) {
              return '<span class="px-1.5 py-0.5 bg-gray-100 text-gray-600 rounded text-[10px] font-medium">' + esc(t) + '</span>';
            }).join('') +
          '</div>' +
          '<div class="mt-auto pt-2 border-t border-gray-100">' +
            '<div class="flex items-baseline gap-1.5 mb-2.5">' +
              (p.discountRate ? '<span class="text-red-500 font-bold text-sm">' + p.discountRate + '%</span>' : '') +
              '<span class="text-gray-900 font-bold text-base">' + esc(p.priceLabel) + '</span>' +
              (p.discountRate ? '<span class="text-gray-400 text-[10px] line-through ml-0.5">' + esc(p.listPriceLabel) + '</span>' : '') +
            '</div>' +
            '<a href="' + esc(E.oliveyoungUrl(p)) + '" target="_blank" rel="noopener noreferrer" ' +
              'class="block text-center w-full py-2 bg-olive text-white text-[13px] font-bold rounded-lg hover:bg-[#8AA82A] transition-colors shadow-sm mb-2">' +
              OBBA.icon('external-link', 'w-3.5 h-3.5 inline-block align-[-2px] mr-1') + '올리브영에서 보기</a>' +
            '<button type="button" data-action="add-cart" data-id="' + esc(p.id) + '" ' +
              'class="w-full py-2 bg-gray-900 text-white text-[13px] font-bold rounded-lg hover:bg-gray-800 transition-colors shadow-sm">' +
              '장바구니 담기</button>' +
          '</div>' +
        '</div>' +
      '</article>';
  }

  function productCarousel(rec, carouselId) {
    var note = rec.note
      ? '<p class="pl-10 pr-4 mt-2 text-[11px] text-gray-500">' +
          OBBA.icon('sparkles', 'w-3.5 h-3.5 inline-block align-[-2px] mr-1 text-olive') +
          esc(rec.note) + '</p>'
      : '';
    return note +
      '<div class="w-full mt-2 pl-10 pr-4 message-enter overflow-hidden">' +
        '<div id="' + esc(carouselId) + '" class="horizontal-scroll-container hide-scrollbar" role="list">' +
          rec.products.map(productCard).join('') +
        '</div>' +
      '</div>';
  }

  function comparisonCard(products, profile) {
    var list = products.slice(0, 4);
    var cells = list.map(function (p) {
      return '<div class="bg-gray-50 p-2 rounded-lg text-center flex flex-col border border-gray-100">' +
        '<div class="text-[10px] text-gray-500 font-bold">' + esc(p.brand) + '</div>' +
        '<div class="text-[11px] font-bold text-gray-800 line-clamp-2 h-8 mb-1">' + esc(p.name) + '</div>' +
        '<div class="text-[11px] font-bold text-gray-900 mb-2">' + esc(p.priceLabel) + '</div>' +
        '<div class="bg-white border border-gray-200 rounded p-1.5 mb-1 flex-1">' +
          '<span class="text-[10px] font-bold text-olive block mb-0.5">이런 분께 딱!</span>' +
          '<span class="text-[11px] text-gray-700 leading-tight">' + esc(p.target) + '</span></div>' +
        '<div class="bg-white border border-gray-200 rounded p-1.5 mb-1 flex-1">' +
          '<span class="text-[10px] font-bold text-blue-500 block mb-0.5">핵심 성분</span>' +
          '<span class="text-[11px] text-gray-700 leading-tight">' + esc((p.keyIngredients || []).join(', ')) + '</span></div>' +
        '<div class="bg-white border border-gray-200 rounded p-1.5 flex-1">' +
          '<span class="text-[10px] font-bold text-purple-500 block mb-0.5">제형</span>' +
          '<span class="text-[11px] text-gray-700 leading-tight">' + esc({ light: '가벼움', medium: '중간', rich: '쫀쫀함' }[p.texture] || '-') + '</span></div>' +
      '</div>';
    }).join('');

    return '<div class="flex items-start gap-2 max-w-[95%] message-enter mt-2">' + AVATAR +
      '<div class="bg-white p-4 rounded-2xl rounded-tl-sm shadow-sm border border-gray-200 w-full">' +
        '<p class="text-sm text-gray-800 font-bold mb-3 border-b pb-2">💡 오빠의 베스트셀러 팩트체크</p>' +
        '<div class="grid grid-cols-2 gap-2">' + cells + '</div>' +
        '<div class="mt-3 bg-olive-soft p-3 rounded-lg text-[13px] text-gray-800 leading-snug">' +
          E.verdict(products, profile) +
        '</div>' +
      '</div></div>';
  }

  function cartSheet() {
    var cart = OBBA.Store.getCart();
    var totals = OBBA.Store.cartTotals();
    var items = E.sortByRoutine(cart.map(function (l) {
      var p = OBBA.byId(l.id);
      return p ? Object.assign({}, p, { qty: l.qty }) : null;
    }).filter(Boolean));

    if (!items.length) {
      return '<div class="p-8 text-center text-gray-500 text-sm">' +
        '<span class="block text-gray-300 mb-3">' + OBBA.icon('smile', 'w-9 h-9 mx-auto') + '</span>' +
        '아직 담은 게 없어!<br>추천 카드에서 마음에 드는 걸 담아봐.</div>';
    }

    var rows = items.map(function (p) {
      var step = E.stepMeta(p.step);
      return '<li class="flex items-center gap-3 py-3 border-b border-gray-100">' +
        '<div class="w-11 h-11 rounded-lg bg-gray-100 flex items-center justify-center text-[10px] font-bold text-gray-500 shrink-0">' + esc(step.label) + '</div>' +
        '<div class="flex-1 min-w-0">' +
          '<p class="text-[11px] text-gray-500 font-bold">' + esc(p.brand) + '</p>' +
          '<p class="text-[12px] font-bold text-gray-800 line-clamp-2 leading-snug">' + esc(p.name) + '</p>' +
          '<p class="text-[12px] text-gray-900 font-bold mt-0.5">' + esc(E.formatWon(p.price * p.qty)) + '</p>' +
        '</div>' +
        '<div class="flex items-center gap-1.5 shrink-0">' +
          '<button type="button" data-action="cart-dec" data-id="' + esc(p.id) + '" aria-label="수량 줄이기" class="w-7 h-7 rounded-full border border-gray-200 text-gray-600 text-sm">−</button>' +
          '<span class="w-5 text-center text-sm font-bold">' + p.qty + '</span>' +
          '<button type="button" data-action="cart-inc" data-id="' + esc(p.id) + '" aria-label="수량 늘리기" class="w-7 h-7 rounded-full border border-gray-200 text-gray-600 text-sm">+</button>' +
        '</div></li>';
    }).join('');

    var searchAllUrl = 'https://www.oliveyoung.co.kr/store/search/getSearchMain.do?query=' +
      encodeURIComponent(items[0].searchQuery || items[0].name);

    return '<ul class="px-4 overflow-y-auto flex-1">' + rows + '</ul>' +
      '<div class="px-4 pt-3 pb-4 border-t border-gray-200 bg-white">' +
        '<div class="flex justify-between text-sm mb-1"><span class="text-gray-500">정가 합계</span>' +
          '<span class="text-gray-400 line-through">' + esc(E.formatWon(totals.listPrice)) + '</span></div>' +
        '<div class="flex justify-between text-base font-bold mb-1"><span>결제 예상</span>' +
          '<span class="text-gray-900">' + esc(E.formatWon(totals.price)) + '</span></div>' +
        '<div class="flex justify-between text-[12px] font-bold text-red-500 mb-3"><span>할인 절약</span>' +
          '<span>-' + esc(E.formatWon(totals.saved)) + '</span></div>' +
        '<a href="' + esc(searchAllUrl) + '" target="_blank" rel="noopener noreferrer" ' +
          'class="block text-center w-full py-3 bg-olive text-white text-sm font-bold rounded-xl mb-2">' +
          '올리브영에서 이어서 담기' + OBBA.icon('external-link', 'w-3.5 h-3.5 inline-block align-[-2px] ml-1') + '</a>' +
        '<div class="flex gap-2">' +
          '<button type="button" data-action="cart-copy" class="flex-1 py-2.5 bg-gray-100 text-gray-700 text-[13px] font-bold rounded-xl">쇼핑 리스트 복사</button>' +
          '<button type="button" data-action="cart-clear" class="py-2.5 px-4 bg-gray-100 text-gray-500 text-[13px] font-bold rounded-xl">비우기</button>' +
        '</div>' +
      '</div>';
  }

  /** 클립보드에 넣을 쇼핑 리스트 텍스트 (오프라인 매장에서 보기용) */
  function cartAsText() {
    var items = E.sortByRoutine(OBBA.Store.getCart().map(function (l) {
      var p = OBBA.byId(l.id);
      return p ? Object.assign({}, p, { qty: l.qty }) : null;
    }).filter(Boolean));
    var totals = OBBA.Store.cartTotals();
    var lines = items.map(function (p) {
      return '· [' + E.stepMeta(p.step).label + '] ' + p.brand + ' ' + p.name +
        (p.qty > 1 ? ' x' + p.qty : '') + ' — ' + E.formatWon(p.price * p.qty);
    });
    return ['🛒 OBBA 쇼핑 리스트'].concat(lines)
      .concat(['합계 ' + E.formatWon(totals.price) + ' (정가 대비 ' + E.formatWon(totals.saved) + ' 절약)'])
      .join('\n');
  }

  OBBA.Render = {
    esc: esc,
    botBubble: botBubble,
    userBubble: userBubble,
    typingBubble: typingBubble,
    quickReplyButton: quickReplyButton,
    productCarousel: productCarousel,
    comparisonCard: comparisonCard,
    cartSheet: cartSheet,
    cartAsText: cartAsText
  };
})();

</script>

<script>
/**
 * OBBA 대화 컨트롤러
 * 흐름: (피부타입) → 상황 → 고민 → 추천 → 비교/취향 반영 → 재추천
 * 모든 클릭은 data-action 위임 리스너 한 곳에서 처리한다.
 */
(function () {
  var R = OBBA.Render;
  var E = OBBA.Engine;
  var Store = OBBA.Store;

  var chat = document.getElementById('chat-container');
  var quickReplies = document.getElementById('quick-reply-container');
  var input = document.getElementById('user-input');
  var sendBtn = document.getElementById('send-btn');
  var cartBadge = document.getElementById('cart-badge');
  var cartSheet = document.getElementById('cart-sheet');
  var cartBody = document.getElementById('cart-sheet-body');
  var backdrop = document.getElementById('sheet-backdrop');
  var profileChip = document.getElementById('profile-chip');

  var state = { step: 'situation', situationId: null, concernId: null, lastRec: null };
  var quickReplyItems = [];
  var quickReplyHandler = null;

  /* ---------------- 기본 유틸 ---------------- */

  function scrollToBottom() {
    chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
  }

  function append(html) {
    chat.insertAdjacentHTML('beforeend', html);
    scrollToBottom();
  }

  function typing(ms) {
    var id = 'typing-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    append(R.typingBubble(id));
    return new Promise(function (resolve) {
      setTimeout(function () {
        var el = document.getElementById(id);
        if (el) el.remove();
        resolve();
      }, ms || 600);
    });
  }

  function botSay(html, ms) {
    clearQuickReplies();
    return typing(ms).then(function () { append(R.botBubble(html)); });
  }

  function userSay(text) { append(R.userBubble(text)); }

  function clearQuickReplies() {
    quickReplies.innerHTML = '';
    quickReplyItems = [];
    quickReplyHandler = null;
  }

  function setQuickReplies(items, handler) {
    quickReplyItems = items;
    quickReplyHandler = handler;
    quickReplies.innerHTML = items.map(R.quickReplyButton).join('');
    quickReplies.scrollLeft = 0;
  }

  function profileLabel() {
    var st = E.skinTypeOf(Store.getProfile().skinType);
    return st && st.id !== 'unknown' ? st.label : null;
  }

  function syncChrome() {
    var count = Store.cartCount();
    cartBadge.textContent = count;
    cartBadge.classList.toggle('hidden', count === 0);
    var label = profileLabel();
    profileChip.textContent = label ? label + ' 프로필' : '피부타입 설정';
    if (cartSheet.classList.contains('open')) cartBody.innerHTML = R.cartSheet();
  }

  /* ---------------- 대화 흐름 ---------------- */

  function start() {
    chat.innerHTML = '';
    state = { step: 'situation', situationId: null, concernId: null, lastRec: null };
    var label = profileLabel();

    var greeting = '안녕! 올리브영 뷰티 어시스턴트 <b>OBBA(오빠)</b>야 😎<br>' +
      '수만 개 제품 중에 너한테 딱 맞는 것만 골라줄게.';

    botSay(greeting, 500).then(function () {
      if (!Store.getProfile().skinType) return askSkinType();
      return botSay('지난번에 알려준 <b>' + R.esc(label) + '</b> 프로필로 골라줄게. (바꾸려면 위의 프로필 버튼을 눌러)<br>' +
        '먼저 <b>어떤 상황</b>을 준비하고 있어?', 500).then(function () {
        state.step = 'situation';
        setQuickReplies(OBBA.SITUATIONS, onSituation);
      });
    });
  }

  function askSkinType() {
    state.step = 'skinType';
    return botSay('제대로 골라주려면 <b>네 피부타입</b>부터 알아야 해. 어느 쪽에 가까워?', 500)
      .then(function () { setQuickReplies(OBBA.SKIN_TYPES, onSkinType); });
  }

  function onSkinType(item, opts) {
    if (!opts || !opts.silent) userSay(item.label);
    Store.patchProfile({ skinType: item.id, texturePref: null });
    syncChrome();
    var st = E.skinTypeOf(item.id);
    var msg = st && st.id !== 'unknown'
      ? '오케이, ' + R.esc(st.label.replace(/^\S+\s/, '')) + ' 기억했어. ' + R.esc(st.hint) + '.<br>이제 <b>어떤 상황</b>을 준비하고 있는지 알려줘!'
      : '괜찮아, 쓰면서 같이 찾아보자.<br>먼저 <b>어떤 상황</b>을 준비하고 있어?';
    return botSay(msg, 700).then(function () {
      state.step = 'situation';
      setQuickReplies(OBBA.SITUATIONS, onSituation);
    });
  }

  function onSituation(item, opts) {
    if (!opts || !opts.silent) userSay(item.label);
    state.situationId = item.id;
    state.step = 'concern';
    return botSay(R.esc(item.reply) + '<br>그럼 그 상황에서 <b>제일 신경 쓰이는 피부 고민</b> 딱 하나만 골라봐.', 700)
      .then(function () { setQuickReplies(OBBA.CONCERNS, onConcern); });
  }

  function onConcern(item, opts) {
    if (!opts || !opts.silent) userSay(item.label);
    state.concernId = item.id;
    return runRecommendation();
  }

  function runRecommendation(prefixMessage) {
    state.step = 'result';
    var intro = prefixMessage || '잠깐만! 오빠가 올리브영 싹 다 뒤져보는 중... 🔍👀';
    return botSay(intro, 500)
      .then(function () { return typing(900); })
      .then(function () {
        var rec = E.recommend({
          situationId: state.situationId,
          concernId: state.concernId,
          profile: Store.getProfile()
        });
        state.lastRec = rec;

        append(R.botBubble(rec.comment));
        var carouselId = 'cards-' + Date.now();
        append(R.productCarousel(rec, carouselId));
        enableDragScroll(carouselId);

        var actions = [];
        if (rec.products.length >= 2) actions.push({ id: 'compare', label: '🤔 뭐가 더 좋을까? (비교)' });
        actions.push({ id: 'cart', label: '🛒 장바구니 보기' });
        actions.push({ id: 'change-skin', label: '🧴 피부타입 바꾸기' });
        actions.push({ id: 'budget', label: '💰 예산으로 다시 고르기' });
        actions.push({ id: 'reset', label: '🔄 다른 고민 상담하기' });
        setQuickReplies(actions, onResultAction);
      });
  }

  function onResultAction(item) {
    if (item.id === 'compare') { userSay(item.label); return showComparison(); }
    if (item.id === 'cart') { openCart(); return; }
    if (item.id === 'change-skin') { userSay(item.label); return askSkinType(); }
    if (item.id === 'budget') {
      userSay(item.label);
      return botSay('예산은 어느 정도로 볼까?', 400).then(function () {
        setQuickReplies(OBBA.BUDGETS, onBudget);
      });
    }
    userSay(item.label);
    return start();
  }

  function onBudget(item) {
    userSay(item.label);
    Store.patchProfile({ budget: item.id });
    syncChrome();
    return runRecommendation('오케이, ' + R.esc(item.short) + ' 기준으로 다시 골라볼게!');
  }

  function showComparison() {
    var rec = state.lastRec;
    if (!rec || rec.products.length < 2) {
      return botSay('지금은 하나만 추천해서 비교할 게 없네! 다른 고민도 말해줄래?', 400)
        .then(function () { setQuickReplies([{ id: 'reset', label: '🔄 처음부터 다시하기' }], function () { start(); }); });
    }
    return typing(800).then(function () {
      append(R.comparisonCard(rec.products, Store.getProfile()));
      return botSay('참고로 너는 평소에 어떤 제형이 좋아? 알려주면 다음 추천부터 바로 반영할게.', 900);
    }).then(function () {
      setQuickReplies([
        { id: 'light', label: '💦 가벼운 수분타입' },
        { id: 'rich', label: '🍯 쫀쫀한 영양타입' },
        { id: 'cart', label: '🛒 장바구니 보기' },
        { id: 'reset', label: '🔄 다른 고민 상담하기' }
      ], onTexturePick);
    });
  }

  function onTexturePick(item) {
    if (item.id === 'cart') { openCart(); return; }
    userSay(item.label);
    if (item.id === 'reset') return start();
    Store.patchProfile({ texturePref: item.id });
    syncChrome();
    return runRecommendation('취향 반영 완료! ' + R.esc(item.label.replace(/^\S+\s/, '')) + ' 기준으로 순서 다시 잡아볼게.');
  }

  /* ---------------- 자연어 입력 ---------------- */

  function processInput() {
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    userSay(text);
    clearQuickReplies();

    if (text.indexOf('장바구니') !== -1 || text.indexOf('카트') !== -1) { openCart(); return; }

    var parsed = E.parse(text);
    var profilePatch = {};
    if (parsed.skinTypeId) profilePatch.skinType = parsed.skinTypeId;
    if (parsed.budgetId) profilePatch.budget = parsed.budgetId;
    if (Object.keys(profilePatch).length) {
      Store.patchProfile(profilePatch);
      syncChrome();
    }

    if (parsed.situationId) state.situationId = parsed.situationId;
    if (parsed.concernId) state.concernId = parsed.concernId;

    // 상황과 고민이 모두 확보되면 곧장 추천으로 점프
    if (state.situationId && state.concernId) {
      var known = [];
      if (parsed.skinTypeId) known.push(E.skinTypeOf(parsed.skinTypeId).label.replace(/^\S+\s/, ''));
      if (parsed.budgetId) known.push(E.budgetOf(parsed.budgetId).short);
      var intro = known.length
        ? R.esc(known.join(' · ')) + ' 체크했어. 바로 골라볼게!'
        : '알겠어, 바로 골라볼게!';
      runRecommendation(intro);
      return;
    }

    if (state.step === 'result' && Object.keys(profilePatch).length) {
      runRecommendation('프로필 업데이트했어. 다시 골라볼게!');
      return;
    }

    if (state.step === 'result' && (text.indexOf('비교') !== -1 || text.indexOf('차이') !== -1)) {
      showComparison();
      return;
    }

    if (!state.situationId) {
      botSay('그 상황은 오빠가 아직 공부 중이야 🥲<br>비슷한 걸로 하나만 골라줄래?', 500)
        .then(function () {
          state.step = 'situation';
          setQuickReplies(OBBA.SITUATIONS, onSituation);
        });
      return;
    }

    botSay('그 고민은 조금 더 연구해봐야겠는걸? 🤔<br>일단 제일 신경 쓰이는 건 뭐야?', 500)
      .then(function () {
        state.step = 'concern';
        setQuickReplies(OBBA.CONCERNS, onConcern);
      });
  }

  /* ---------------- 장바구니 시트 ---------------- */

  function openCart() {
    cartBody.innerHTML = R.cartSheet();
    cartSheet.classList.add('open');
    backdrop.classList.add('open');
    cartSheet.setAttribute('aria-hidden', 'false');
  }

  function closeCart() {
    cartSheet.classList.remove('open');
    backdrop.classList.remove('open');
    cartSheet.setAttribute('aria-hidden', 'true');
  }

  function copyCart() {
    var text = R.cartAsText();
    var done = function () {
      var btn = cartBody.querySelector('[data-action="cart-copy"]');
      if (!btn) return;
      var original = btn.textContent;
      btn.textContent = '복사 완료!';
      setTimeout(function () { btn.textContent = original; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, done);
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) { /* 무시 */ }
      document.body.removeChild(ta);
      done();
    }
  }

  /* ---------------- 이벤트 위임 ---------------- */

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    var id = el.getAttribute('data-id');

    if (action === 'qr') {
      var item = quickReplyItems.find(function (i) { return i.id === id; });
      if (item && quickReplyHandler) {
        var handler = quickReplyHandler;
        clearQuickReplies();
        handler(item);
      }
      return;
    }
    if (action === 'add-cart') {
      Store.addToCart(id);
      syncChrome();
      el.textContent = '담았어! 🛒';
      el.classList.add('bg-olive');
      setTimeout(function () {
        el.textContent = '장바구니 담기';
        el.classList.remove('bg-olive');
      }, 1200);
      return;
    }
    if (action === 'cart-open') { openCart(); return; }
    if (action === 'cart-close') { closeCart(); return; }
    if (action === 'cart-inc') { Store.addToCart(id); syncChrome(); return; }
    if (action === 'cart-dec') {
      var line = Store.getCart().find(function (l) { return l.id === id; });
      Store.setQty(id, line ? line.qty - 1 : 0);
      syncChrome();
      return;
    }
    if (action === 'cart-clear') { Store.clearCart(); syncChrome(); return; }
    if (action === 'cart-copy') { copyCart(); return; }
    if (action === 'edit-profile') { closeCart(); askSkinType(); return; }
    if (action === 'restart') { closeCart(); start(); return; }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && cartSheet.classList.contains('open')) closeCart();
  });

  sendBtn.addEventListener('click', processInput);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') processInput();
  });

  /* 데스크톱에서 카드 캐러셀 드래그 스크롤 */
  function enableDragScroll(containerId) {
    var slider = document.getElementById(containerId);
    if (!slider) return;
    var isDown = false, startX = 0, scrollLeft = 0;
    slider.addEventListener('mousedown', function (e) {
      isDown = true;
      slider.classList.add('dragging');
      startX = e.pageX - slider.offsetLeft;
      scrollLeft = slider.scrollLeft;
    });
    ['mouseleave', 'mouseup'].forEach(function (evt) {
      slider.addEventListener(evt, function () {
        isDown = false;
        slider.classList.remove('dragging');
      });
    });
    slider.addEventListener('mousemove', function (e) {
      if (!isDown) return;
      e.preventDefault();
      slider.scrollLeft = scrollLeft - ((e.pageX - slider.offsetLeft) - startX) * 1.4;
    });
  }

  Store.subscribe(syncChrome);
  syncChrome();
  start();
})();
