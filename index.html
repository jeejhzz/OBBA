<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="상황과 피부 고민만 고르면 올리브영 제품을 골라주는 대화형 뷰티 어시스턴트">
  <meta name="theme-color" content="#9BBF30">
  <title>OBBA - Oliveyoung Beauty Browser Assistant</title>

  <!-- 외부 CDN 의존 없음: 폰트·스타일·아이콘 전부 저장소 안에 있다 -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link href="assets/fonts/pretendard/pretendard-dynamic-subset.css" rel="stylesheet">
  <link href="assets/css/obba.css" rel="stylesheet">
</head>
<body>

  <div class="mobile-container">

    <!-- 헤더 -->
    <header class="bg-white border-b px-3 py-2.5 flex items-center justify-between gap-2 z-10 shadow-sm shrink-0">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-full bg-olive flex items-center justify-center text-white font-bold shadow-md shrink-0" aria-hidden="true">OB</div>
        <div class="min-w-0">
          <h1 class="text-base font-bold text-gray-800 leading-tight truncate">OBBA <span data-icon="leaf" data-icon-class="w-3.5 h-3.5 inline-block align-[-1px] text-olive"></span></h1>
          <button type="button" id="profile-chip" data-action="edit-profile"
                  class="text-[10px] text-gray-500 hover:text-olive border border-gray-200 rounded-full px-2 py-0.5 mt-0.5 truncate max-w-[140px]">
            피부타입 설정
          </button>
        </div>
      </div>

      <div class="flex items-center gap-1 shrink-0">
        <button type="button" data-action="cart-open" aria-label="장바구니 열기"
                class="relative w-9 h-9 rounded-full text-gray-500 hover:text-olive hover:bg-gray-50 transition-colors">
          <span data-icon="shopping-bag" data-icon-class="w-[18px] h-[18px] mx-auto"></span>
          <span id="cart-badge" class="hidden absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center">0</span>
        </button>
        <button type="button" data-action="restart" aria-label="대화 처음부터 다시하기"
                class="w-9 h-9 rounded-full text-gray-400 hover:text-gray-600 hover:bg-gray-50 transition-colors">
          <span data-icon="rotate-cw" data-icon-class="w-[18px] h-[18px] mx-auto"></span>
        </button>
      </div>
    </header>

    <!-- 대화 -->
    <main id="chat-container" role="log" aria-live="polite" aria-label="OBBA 상담 대화"
          class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50"></main>

    <!-- 퀵 리플라이 -->
    <div class="w-full bg-gray-50 pt-1 pb-2 shrink-0">
      <div id="quick-reply-container" class="horizontal-scroll-container hide-scrollbar px-4 w-full" aria-label="빠른 답변"></div>
    </div>

    <!-- 입력 -->
    <footer class="w-full bg-white border-t border-gray-200 px-4 py-3 shrink-0 flex items-center gap-2 shadow-[0_-5px_15px_rgba(0,0,0,0.05)]"
            style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom));">
      <label for="user-input" class="sr-only">피부 고민 입력</label>
      <input type="text" id="user-input" autocomplete="off" enterkeyhint="send"
             class="flex-1 bg-gray-100 rounded-full px-4 py-2.5 outline-none focus:ring-2 focus:ring-olive/50 text-sm transition-shadow"
             placeholder="예) 복합성인데 여행 갈 때 진정 제품">
      <button type="button" id="send-btn" aria-label="보내기"
              class="w-10 h-10 bg-olive text-white rounded-full flex items-center justify-center shrink-0 hover:bg-[#8AA82A] transition-colors shadow-sm">
        <span data-icon="send" data-icon-class="w-[18px] h-[18px]"></span>
      </button>
    </footer>

    <!-- 장바구니 바텀시트 -->
    <div id="sheet-backdrop" class="sheet-backdrop" data-action="cart-close"></div>
    <section id="cart-sheet" class="sheet" aria-hidden="true" aria-label="장바구니">
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
        <h2 class="text-sm font-bold text-gray-800">🛒 오빠가 담아준 리스트</h2>
        <button type="button" data-action="cart-close" aria-label="닫기" class="w-8 h-8 text-gray-400 hover:text-gray-600">
          <span data-icon="x" data-icon-class="w-[18px] h-[18px] mx-auto"></span>
        </button>
      </div>
      <div id="cart-sheet-body" class="flex-1 flex flex-col overflow-hidden"></div>
    </section>

  </div>

  <script src="assets/js/data/catalog.js"></script>
  <script src="assets/js/data/flows.js"></script>
  <script src="assets/js/core/store.js"></script>
  <script src="assets/js/core/engine.js"></script>
  <script src="assets/js/ui/icons.js"></script>
  <script src="assets/js/ui/render.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
