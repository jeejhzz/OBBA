<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>OBBA - Oliveyoung Beauty Browser Assistant</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        @media (min-width: 640px) {
            .mobile-container {
                height: 800px;
                border-radius: 2rem;
                overflow: hidden;
                border: 8px solid #1f2937;
            }
        }

        .bg-olive { background-color: #9BBF30; }
        .text-olive { color: #9BBF30; }
        .border-olive { border-color: #9BBF30; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 가로 스크롤 부드럽게 (모바일 친화적) */
        .horizontal-scroll-container {
            display: flex;
            flex-wrap: nowrap; /* 항목들이 다음 줄로 넘어가지 않도록 강제 */
            gap: 12px;
            overflow-x: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 8px; /* 스크롤바 영역 확보 */
            scroll-snap-type: x mandatory; /* 스와이프 시 찰칵 멈추게 */
            width: 100%;
        }

        .horizontal-scroll-item {
            scroll-snap-align: start; /* 아이템 시작점에 스크롤 맞춤 */
            flex-shrink: 0;
            white-space: normal; /* 텍스트 줄바꿈 허용 */
        }

        .message-enter {
            animation: slideUp 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>

    function enableDragScroll(containerId) {
            const slider = document.getElementById(containerId);
            if(!slider) return;
            let isDown = false;
            let startX;
            let scrollLeft;

            slider.addEventListener('mousedown', (e) => {
                isDown = true;
                slider.classList.add('cursor-grabbing');
                startX = e.pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
            });
            slider.addEventListener('mouseleave', () => {
                isDown = false;
                slider.classList.remove('cursor-grabbing');
            });
            slider.addEventListener('mouseup', () => {
                isDown = false;
                slider.classList.remove('cursor-grabbing');
            });
            slider.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - slider.offsetLeft;
                const walk = (x - startX) * 2; // 스크롤 속도
                slider.scrollLeft = scrollLeft - walk;
            });
        }

            renderQuickReplies(chatData.situations, handleSituationSelection);
        }

        function resetChat() {
            startChatFlow();
        }

        window.onload = () => {
            startChatFlow();
        };
    </script>
</body>
</html>
