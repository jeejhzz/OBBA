<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBBA - Real AI Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 flex justify-center items-center h-screen m-0 p-0 overflow-hidden">

    <div class="w-full max-w-md h-full bg-white shadow-2xl flex flex-col relative overflow-hidden">
        
        <!-- 헤더 -->
        <div class="bg-white border-b border-slate-100 px-4 py-3 flex justify-between items-center z-10 shadow-sm">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center text-white font-bold text-lg shadow-md">OB</div>
                <div>
                    <h1 class="font-bold text-slate-800 text-base leading-tight">OBBA (AI 오빠)</h1>
                    <p class="text-xs text-slate-400">LLM API Connected</p>
                </div>
            </div>
            <button onclick="resetChat()" class="p-2 text-slate-500 hover:text-red-500 hover:bg-slate-50 rounded-full transition" title="초기화">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
        </div>

        <!-- 채팅 영역 -->
        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scroll pb-24"></div>

        <!-- 입력 영역 -->
        <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-100 p-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-20">
            <div class="flex items-center space-x-2">
                <input type="text" id="userInput" placeholder="피부 고민을 편하게 말해줘!" 
                    class="flex-1 bg-slate-100 border-0 rounded-full px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-700"
                    onkeypress="if(event.key === 'Enter') handleUserText()">
                <button onclick="handleUserText()" class="bg-emerald-600 text-white rounded-full p-2.5 hover:bg-emerald-700 transition flex items-center justify-center shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // 🚨 여기에 OpenAI API 키를 붙여넣으세요! 
        // 예: const OPENAI_API_KEY = "sk-proj-xxxxxxxx...";
        const OPENAI_API_KEY = "여기에_발급받은_API_키를_입력해"; 

        const chatContainer = document.getElementById('chatContainer');
        
        // 🧠 프롬프트 엔지니어링: OBBA의 페르소나 주입
        let chatHistory = [
            { 
                role: "system", 
                content: `너는 올리브영 뷰티 어시스턴트 'OBBA(오빠)'야. 
                사용자에게 다정하고 센스 있는 뷰티 전문가 오빠처럼 반말로 대화해. 
                이모지를 적극적으로 사용하고, 문장은 너무 길지 않게 2~3문장으로 끊어서 가독성 있게 답변해. 
                올리브영 화장품 추천을 요청받으면 너의 지식을 바탕으로 이유와 함께 추천해 줘.` 
            }
        ];

        function initChat() {
            chatContainer.innerHTML = '';
            chatHistory = [chatHistory[0]]; // 시스템 프롬프트만 남기고 초기화
            addBotMessage("안녕! 진짜 인공지능 두뇌를 장착한 OBBA(오빠)야. 오늘 피부 컨디션 어때? 😎", "welcome");
        }

        function addBotMessage(text, id = "") {
            // 마크다운 줄바꿈 처리
            const formattedText = text.replace(/\n/g, '<br>');
            const divId = id ? `id="${id}"` : '';
            chatContainer.innerHTML += `
                <div ${divId} class="flex items-start space-x-2 mb-4">
                    <div class="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center text-white font-bold text-xs shrink-0 shadow">OB</div>
                    <div class="bg-slate-100 text-slate-800 p-3.5 rounded-2xl rounded-tl-sm text-sm max-w-[85%] leading-relaxed">${formattedText}</div>
                </div>`;
            scrollToBottom();
        }

        function addUserMessage(text) {
            chatContainer.innerHTML += `
                <div class="flex justify-end mb-4">
                    <div class="bg-emerald-600 text-white p-3.5 rounded-2xl rounded-tr-sm text-sm max-w-[85%] leading-relaxed shadow-sm">${text}</div>
                </div>`;
            scrollToBottom();
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        async function handleUserText() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;
            
            addUserMessage(text);
            input.value = '';

            // 사용자 메시지를 히스토리에 추가 (문맥 유지)
            chatHistory.push({ role: "user", content: text });

            const loadingId = "loading-" + Date.now();
            addBotMessage('<span class="animate-pulse">오빠가 올리브영 꿀템 뇌피셜 돌리는 중... 💭</span>', loadingId);

            if (OPENAI_API_KEY === "여기에_발급받은_API_키를_입력해") {
                removeMessage(loadingId);
                addBotMessage("앗! 아직 내 머릿속(API KEY)이 연결 안 됐어. 코드에서 <code>OPENAI_API_KEY</code>를 먼저 입력해 줘! 😭");
                return;
            }

            try {
                // LLM API 호출
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini", // 빠르고 저렴한 모델
                        messages: chatHistory,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);

                const botReply = data.choices[0].message.content;

                removeMessage(loadingId);
                addBotMessage(botReply);

                // 봇의 대답을 히스토리에 추가하여 다음 질문 시 기억하게 함
                chatHistory.push({ role: "assistant", content: botReply });

            } catch (error) {
                removeMessage(loadingId);
                addBotMessage("네트워크 에러가 발생했어. API 키나 잔액을 확인해 볼래? 🛠️<br>상세 오류: " + error.message);
                console.error(error);
            }
        }

        function resetChat() {
            initChat();
        }

        function scrollToBottom() {
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }

        window.onload = initChat;
    </script>
</body>
</html>
